<title>Mahyar's Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: tabs All · Unscheduled · Overdue · Week · Today over one list of open CTO issues grouped by priority, each row with Linear-style priority and status icons; a row opens its details in a side panel. Reads Linear live; the status icon is a menu that writes the issue's status back to Linear, and hover actions per tab set or clear the due date. */
:root {
  --bg: #f3f5f7; --surface: #ffffff; --sunk: #e9edf1; --ink: #18202b; --muted: #5b6574; --faint: #8a93a1; --line: #dde2e8; --line-soft: #edf0f3;
  --accent: #12676b; --accent-soft: #e2f0ef; --accent-ink: #ffffff;
  --urgent: #b4401f; --wait: #7a5a12; --wait-soft: #f6efdc; --warn: #8a5700; --bad: #a33a22;
  --st-triage: #d9622b; --st-progress: #c99a06; --st-review: #2f9e5b; --st-wait: #9a7420; --st-done: #5e6ad2;
  --a-eviplex: #12676b; --a-platform: #3b6fb6; --a-medical: #8a4fb5; --a-cross: #8a94a3;
  --scrim: rgba(16, 20, 26, 0.28);
  --font-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10141a; --surface: #171c24; --sunk: #1d232c; --ink: #e5e9ef; --muted: #97a1af; --faint: #6c7684; --line: #29303b; --line-soft: #222832;
    --accent: #5db3ae; --accent-soft: #173233; --accent-ink: #0b1a1b;
    --urgent: #f0896b; --wait: #e2b65a; --wait-soft: #30281a; --warn: #e5ae4b; --bad: #f0896b;
    --st-triage: #f2945e; --st-progress: #f2c94c; --st-review: #4cb782; --st-wait: #d9a94a; --st-done: #8b93f0;
    --a-eviplex: #5db3ae; --a-platform: #7aa7e6; --a-medical: #c194e6; --a-cross: #8a94a3;
    --scrim: rgba(0, 0, 0, 0.5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10141a; --surface: #171c24; --sunk: #1d232c; --ink: #e5e9ef; --muted: #97a1af; --faint: #6c7684; --line: #29303b; --line-soft: #222832;
  --accent: #5db3ae; --accent-soft: #173233; --accent-ink: #0b1a1b;
  --urgent: #f0896b; --wait: #e2b65a; --wait-soft: #30281a; --warn: #e5ae4b; --bad: #f0896b;
  --st-triage: #f2945e; --st-progress: #f2c94c; --st-review: #4cb782; --st-wait: #d9a94a; --st-done: #8b93f0;
  --a-eviplex: #5db3ae; --a-platform: #7aa7e6; --a-medical: #c194e6; --a-cross: #8a94a3;
  --scrim: rgba(0, 0, 0, 0.5); color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 22px 48px;
}
.page { max-width: 920px; margin: 0 auto; display: grid; gap: 18px; }
button { font: inherit; font-size: 0.84rem; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 6px 12px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.quiet { background: transparent; border-color: transparent; color: var(--muted); }
button.quiet:hover { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: flex-end; justify-content: space-between; }
h1 { font-weight: 600; font-size: 1.6rem; letter-spacing: -0.01em; line-height: 1.1; margin: 0; }
.sub { color: var(--muted); font-size: 0.86rem; margin-top: 4px; font-variant-numeric: tabular-nums; }
.tools { display: flex; gap: 10px; align-items: center; }

/* list toolbar: count left, round Filter and Display buttons right, filter chips below (like a Linear view) */
.listbar { position: relative; display: grid; gap: 8px; }
.toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 34px; }
.count { color: var(--muted); font-size: 0.9rem; font-variant-numeric: tabular-nums; }
.tb-right { display: flex; gap: 6px; }
.round { width: 32px; height: 32px; padding: 0; border-radius: 50%; display: inline-grid; place-items: center; color: var(--muted); background: var(--surface); border: 1px solid var(--line); }
.round:hover { color: var(--ink); border-color: var(--faint); }
.round[aria-expanded="true"], .round.on { color: var(--accent); border-color: var(--accent); }
.menu { position: absolute; z-index: 20; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 4px; min-width: 210px; display: grid; gap: 1px; box-shadow: 0 8px 22px rgba(16, 20, 26, 0.12); }
.mi { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 8px; border: 0; border-radius: 6px; background: none; color: var(--ink); font-size: 0.86rem; text-align: left; cursor: pointer; }
.mi:hover { background: var(--sunk); border-color: transparent; }
.mi .n { margin-left: auto; font-family: var(--font-mono); font-size: 0.72rem; color: var(--faint); }
.mi .chev { margin-left: auto; color: var(--faint); }
.mi input { margin: 0; accent-color: var(--accent); }
.mhead { display: flex; align-items: center; gap: 6px; padding: 4px 6px 6px; font-size: 0.74rem; color: var(--muted); border-bottom: 1px solid var(--line-soft); margin-bottom: 2px; }
.mhead button { border: 0; background: none; padding: 0 4px; color: var(--muted); font-size: 0.9rem; }
.inline { display: flex; align-items: center; gap: 8px; padding: 2px 2px 2px 8px; white-space: nowrap; }
.inline label { font-size: 0.82rem; color: var(--muted); }
.sel { position: relative; display: inline-flex; }
.sel::after { content: ""; position: absolute; right: 10px; top: 50%; width: 5px; height: 5px; border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: translateY(-70%) rotate(45deg); pointer-events: none; }
.sel select { appearance: none; -webkit-appearance: none; font: inherit; font-size: 0.82rem; font-weight: 500; color: var(--ink); background: var(--sunk); border: 0; border-radius: 6px; padding: 4px 26px 4px 10px; cursor: pointer; }
.sel select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { display: inline-flex; align-items: stretch; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); font-size: 0.8rem; overflow: hidden; }
.chip button { border: 0; border-radius: 0; background: none; padding: 3px 8px; font-size: 0.8rem; }
.chip button:hover { background: var(--sunk); }
.chip .f { color: var(--muted); }
.chip .op { color: var(--faint); margin: 0 4px; }
.chip .x { border-left: 1px solid var(--line-soft); color: var(--muted); padding: 3px 7px; }
.fresh { color: var(--muted); font-size: 0.8rem; }

.tabs { display: flex; gap: 2px; background: var(--sunk); border-radius: 10px; padding: 3px; justify-self: start; max-width: 100%; overflow-x: auto; }
.tabs a { text-decoration: none; color: var(--muted); font-weight: 500; font-size: 0.9rem; padding: 6px 16px; border-radius: 8px; white-space: nowrap; display: inline-flex; gap: 6px; align-items: baseline; }
.tabs a:hover { color: var(--ink); }
.tabs a[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(16, 20, 26, 0.12); }
.tabs .c { font-family: var(--font-mono); font-size: 0.74rem; color: var(--faint); }
.banner { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.banner.warn { border-color: var(--warn); } .banner.bad { border-color: var(--bad); }
.banner p { margin: 0; flex: 1 1 260px; min-width: 0; }

.group { display: grid; gap: 6px; }
.ghead { display: flex; gap: 8px; align-items: center; padding: 0 4px; }
.ghead .t { font-size: 0.74rem; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }
.ghead .n { font-family: var(--font-mono); font-size: 0.74rem; color: var(--faint); }
.list { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.row { display: grid; grid-template-columns: 18px 62px 22px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line-soft); cursor: pointer; }
.row:first-child { border-top: 0; }
.row:hover { background: var(--sunk); }
.row.sel { background: var(--accent-soft); }
.row .id { font-family: var(--font-mono); font-size: 0.76rem; color: var(--muted); }
.row .main { min-width: 0; display: grid; gap: 2px; }
.row .title { font-weight: 500; overflow-wrap: anywhere; }
.row .main { gap: 5px; }
.row .meta { display: flex; flex-wrap: wrap; gap: 5px; font-size: 0.74rem; color: var(--muted); align-items: center; }
.tag { display: inline-flex; gap: 5px; align-items: center; padding: 1px 8px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; line-height: 1.5; }
.tag.overdue { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
.tag.today { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.tag svg { width: 11px; height: 11px; flex: none; }
.row .right { display: flex; gap: 6px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
.act { width: 28px; height: 28px; padding: 0; display: inline-grid; place-items: center; border-radius: 7px; color: var(--muted); background: var(--surface); }
.act svg { width: 16px; height: 16px; display: block; }
.act:hover { color: var(--ink); border-color: var(--accent); }
@media (hover: hover) { .row .acts { opacity: 0; transition: opacity 0.12s; } .row:hover .acts, .row:focus-within .acts { opacity: 1; } }
@media (max-width: 620px) {
  .row { grid-template-columns: 18px 22px minmax(0, 1fr); }
  .row .id { display: none; }
  .row .right { grid-column: 3; justify-content: flex-start; }
}
.area { display: inline-flex; gap: 5px; align-items: center; }
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.dot.eviplex { background: var(--a-eviplex); } .dot.platform { background: var(--a-platform); } .dot.medical { background: var(--a-medical); } .dot.cross { background: var(--a-cross); }
.folder { display: inline-flex; gap: 4px; align-items: center; }
.pill { font-size: 0.72rem; padding: 2px 8px; border-radius: 999px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.pill.started { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.pill.waiting { background: var(--wait-soft); color: var(--wait); font-weight: 500; }
.date { font-size: 0.76rem; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.date.past { color: var(--faint); }
.prio { width: 16px; height: 16px; display: block; color: var(--muted); }
.prio.urgent { color: var(--urgent); }
.st { width: 14px; height: 14px; display: block; flex: none; color: var(--muted); }
.st.backlog { color: var(--faint); } .st.triage { color: var(--st-triage); } .st.started { color: var(--st-progress); } .st.review { color: var(--st-review); } .st.waiting { color: var(--st-wait); } .st.completed { color: var(--st-done); } .st.canceled { color: var(--faint); }
.stbtn { width: 22px; height: 22px; padding: 0; border: 0; border-radius: 6px; background: none; display: inline-grid; place-items: center; cursor: pointer; }
.stbtn:hover, .stbtn[aria-expanded="true"] { background: var(--line); border-color: transparent; }
.smenu { position: fixed; z-index: 40; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 4px; min-width: 200px; display: grid; gap: 1px; box-shadow: 0 8px 22px rgba(16, 20, 26, 0.16); }
.smenu .mnote { padding: 6px 8px; font-size: 0.84rem; color: var(--muted); max-width: 260px; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 50; max-width: calc(100% - 32px); display: flex; gap: 10px; align-items: center; background: var(--ink); color: var(--bg); border-radius: 10px; padding: 8px 10px 8px 14px; font-size: 0.86rem; box-shadow: 0 8px 22px rgba(16, 20, 26, 0.2); }
.toast button { background: none; border: 0; color: inherit; font-weight: 600; text-decoration: underline; padding: 2px 4px; }
.empty { color: var(--muted); margin: 0; padding: 18px; text-align: center; border: 1px dashed var(--line); border-radius: 12px; }

/* side panel */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 30; }
.panel { position: fixed; top: 0; right: 0; bottom: 0; width: min(480px, 100%); background: var(--surface); border-left: 1px solid var(--line); z-index: 31; overflow-y: auto;
  padding: calc(16px + env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)) 20px;
  display: grid; gap: 18px; align-content: start; box-shadow: -10px 0 30px rgba(16, 20, 26, 0.14); }
.p-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.p-top .id { font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); }
.panel h2 { font-weight: 600; font-size: 1.25rem; line-height: 1.3; margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 7px 16px; margin: 0; font-size: 0.88rem; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
.facts code { font-family: var(--font-mono); font-size: 0.8rem; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); font: inherit; cursor: pointer; text-align: left; }
.linkbtn:hover { text-decoration: underline; }
.ball { display: grid; gap: 10px; background: var(--sunk); border-radius: 10px; padding: 12px 14px; }
.ball div { display: grid; gap: 2px; }
.ball .k { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }
.ball .wait .k { color: var(--wait); }
.k2 { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }
.desc { font-size: 0.9rem; max-width: 65ch; overflow-wrap: anywhere; }
.desc > :first-child { margin-top: 0; }
.desc p, .desc ul, .desc ol { margin: 0 0 10px; }
.desc ul, .desc ol { padding-left: 20px; }
.desc h3, .desc h4 { font-size: 0.95rem; margin: 14px 0 6px; }
.desc code { font-family: var(--font-mono); font-size: 0.8rem; background: var(--sunk); padding: 1px 4px; border-radius: 4px; }
.desc a, .p-link { color: var(--accent); }
.desc details { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; margin: 0 0 10px; }
.desc summary { cursor: pointer; color: var(--muted); }
.loading { color: var(--faint); font-size: 0.86rem; }
.p-link { font-weight: 500; text-decoration: none; }
.p-link:hover { text-decoration: underline; }
</style>

<div class="page">
  <header>
    <div>
      <h1>Mahyar's Board</h1>
      <div class="sub" id="sub">Loading your issues from Linear…</div>
    </div>
    <div class="tools">
      <span class="fresh" id="fresh"></span>
      <button type="button" id="refresh">Refresh</button>
    </div>
  </header>
  <nav class="tabs" id="tabs" aria-label="Views"></nav>
  <div class="listbar" id="listbar">
    <div class="toolbar">
      <span class="count" id="count"></span>
      <div class="tb-right">
        <button type="button" class="round" id="filter-btn" aria-label="Filter" title="Filter" aria-expanded="false"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M7 12h10M10 17h4"></path></svg></button>
        <button type="button" class="round" id="display-btn" aria-label="Display options" title="Display options" aria-expanded="false"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 8h6M14 8h6M4 16h10M18 16h2"></path><circle cx="12" cy="8" r="2"></circle><circle cx="16" cy="16" r="2"></circle></svg></button>
      </div>
    </div>
    <div class="chips" id="chips" hidden></div>
    <div class="menu" id="menu" role="dialog" aria-label="Options" hidden></div>
  </div>
  <div id="banner" hidden></div>
  <main id="groups"></main>
</div>
<div id="panelhost"></div>

<script>
(() => {
  const LINEAR = "Linear";
  const TEAM = "CTO";
  const FIELDS = ["id", "title", "url", "dueDate", "status", "statusType", "labels", "parentId", "priority", "updatedAt", "description"];
  const OPEN = new Set(["triage", "backlog", "unstarted", "started"]);
  const AREAS = ["Eviplex", "Platform", "Medical", "Cross"];
  const AUTHZ = new Set(["needs_reauth", "server_not_connected", "blocked_by_policy", "approval_required", "not_in_manifest", "selection_required", "not_granted", "capability_disabled", "capability_removed", "consent_required"]);
  const GROUPS = [[1, "Urgent"], [2, "High"], [3, "Medium"], [4, "Low"], [0, "No priority"]];
  const STATUS_ORDER = { started: 0, unstarted: 1, triage: 2, backlog: 3 };

  let mcp = null;
  const state = { status: "loading", issues: [], error: null, at: null, more: false };
  const full = {};             // id -> full description from get_issue
  const fullWatch = new Map(); // id -> unsubscribe
  let openId = null;

  // ---------- helpers ----------
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const pad = n => String(n).padStart(2, "0");
  const WD = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parseYmd = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const fmtDate = s => { const d = parseYmd(s); return `${WD[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`; };
  const labelsOf = i => i.labels || [];
  const areaOf = i => labelsOf(i).find(l => AREAS.includes(l)) || "";
  const hasFolder = i => labelsOf(i).includes("Folder");
  const prioOf = i => (i.priority && typeof i.priority.value === "number") ? i.priority.value : 0;
  const isWaiting = i => /waiting|delegated/i.test(i.status || "");
  const descOf = i => full[i.id] || i.description || "";
  const clean = s => s.replace(/…?\s*\(truncated[^)]*\)/g, "…").replace(/\*\*/g, "").replace(/`/g, "").replace(/<[^>]+>/g, "").replace(/\s+/g, " ").trim();
  const lineOf = (i, key) => { const m = descOf(i).match(new RegExp("\\*\\*" + key + "[^*]*:\\*\\*\\s*([^\\n]+)")); return m ? clean(m[1]) : ""; };
  function folderOf(i) {
    const m = descOf(i).match(/\*\*(?:Folder|Brief[^*]*):\*\*[^`\n]*`([^`]+)`/);
    return m ? m[1].replace(/\/$/, "") : (hasFolder(i) ? "has a folder" : "");
  }
  const safeUrl = u => /^https:\/\//i.test(String(u || "")) ? String(u) : null;
  const linearUrl = i => safeUrl(i.url) || `https://linear.app/fomf/issue/${encodeURIComponent(String(i.id).toLowerCase())}`;
  function sorter(a, b) {
    return (STATUS_ORDER[a.statusType] ?? 9) - (STATUS_ORDER[b.statusType] ?? 9)
      || (a.dueDate || "9999").localeCompare(b.dueDate || "9999")
      || String(a.id).localeCompare(String(b.id), undefined, { numeric: true });
  }
  const openIssues = () => state.issues.filter(i => OPEN.has(i.statusType));
  const byId = id => state.issues.find(i => i.id === id);

  // ---------- views: All · Unscheduled · Overdue · Week · Today ----------
  // Overdue = due date before today. Week and Today never show overdue issues.
  // Week = not overdue, and outside Backlog or due by Sunday (the board's rule: Backlog holds what is not this week).
  // Today = due date today.
  // Unscheduled = no due date.
  const VIEWS = [["all", "All"], ["unscheduled", "Unscheduled"], ["overdue", "Overdue"], ["week", "Week"], ["today", "Today"]];
  const todayYmd = () => ymd(new Date());
  const sundayYmd = () => { const n = new Date(); return ymd(new Date(n.getFullYear(), n.getMonth(), n.getDate() + (7 - n.getDay()) % 7)); };
  const isOverdue = i => !!i.dueDate && i.dueDate < todayYmd();
  const inWeek = i => !isOverdue(i) && (i.statusType !== "backlog" || (!!i.dueDate && i.dueDate <= sundayYmd()));
  const inToday = i => i.dueDate === todayYmd();
  const isUnscheduled = i => !i.dueDate;
  const FILTERS = { all: () => true, overdue: isOverdue, week: inWeek, today: inToday, unscheduled: isUnscheduled };
  const viewIssues = v => openIssues().filter(FILTERS[v] || FILTERS.all).filter(matchFilters);

    // Order everywhere: Unschedule, This week (or Remove from today), Today.
    // On All, an issue gets the actions of the tab it belongs to; one due after this week gets Unschedule, Today, This week.
    const tab = view !== "all" ? view : !i.dueDate ? "unscheduled" : isOverdue(i) ? "overdue" : inToday(i) ? "today" : i.dueDate <= sundayYmd() ? "week" : "later";
    if (tab === "unscheduled") return [week, today].filter(Boolean);
    if (tab === "overdue" || tab === "later") return [un, week, today].filter(Boolean);
    if (tab === "week") return (i.dueDate === t ? [un] : [un, today]).filter(Boolean);
    if (tab === "today") return [un, wk && wk !== t ? ["Remove from today", () => schedule(i, wk)] : null].filter(Boolean);
    return [];
  }
  const toastEl = el("div", "toast"); toastEl.setAttribute("role", "status"); toastEl.hidden = true;
  document.body.append(toastEl);
  let toastTimer = null;
  function showToast(text, undo) {
    toastEl.textContent = ""; toastEl.append(el("span", null, text));
    if (undo) { const b = el("button", null, "Undo"); b.type = "button"; b.addEventListener("click", () => { toastEl.hidden = true; undo(); }); toastEl.append(b); }
    toastEl.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { toastEl.hidden = true; }, 6000);
  }

  function dateTag(i) {
    if (!i.dueDate) return null;
    const past = i.dueDate < ymd(new Date());
    const t = el("span", "date" + (past ? " past" : ""), (past ? "was " : "") + fmtDate(i.dueDate));
    t.title = "Check-in date";
    return t;
  }
  // Chips on a row's second line: due date, area, folder, parent.
  function tagIcon(d) {
    const s = document.createElementNS(SVG_NS, "svg"); s.setAttribute("viewBox", "0 0 12 12"); s.setAttribute("aria-hidden", "true");
    const p = document.createElementNS(SVG_NS, "path"); p.setAttribute("d", d); p.setAttribute("fill", "none"); p.setAttribute("stroke", "currentColor"); p.setAttribute("stroke-width", "1.2"); p.setAttribute("stroke-linecap", "round"); p.setAttribute("stroke-linejoin", "round");
    s.append(p); return s;
  }
  const ICON_CAL = "M2 3.5h8v6.5H2zM2 5.5h8M4 2v2.5M8 2v2.5";
  const ICON_FOLDER = "M1.5 3h3l1 1.2h5v5.3h-9z";
  const ICON_PARENT = "M3 2v5.5h6M7 5.5l2 2-2 2";
  function rowTags(i) {
    const out = [];
    if (i.dueDate) {
      const t = todayYmd(), cls = i.dueDate < t ? " overdue" : i.dueDate === t ? " today" : "";
      const c = el("span", "tag" + cls); c.title = "Check-in date";
      c.append(tagIcon(ICON_CAL), document.createTextNode(i.dueDate < t ? `Overdue · ${fmtDate(i.dueDate)}` : i.dueDate === t ? "Due today" : `Due ${fmtDate(i.dueDate)}`));
      out.push(c);
    }
    const a = areaOf(i);
    if (a) { const c = el("span", "tag"); c.append(el("span", "dot " + a.toLowerCase()), document.createTextNode(a)); out.push(c); }
    const f = folderOf(i);
    if (f) { const c = el("span", "tag"); c.title = "Topic folder"; c.append(tagIcon(ICON_FOLDER), document.createTextNode(f)); out.push(c); }
    if (i.parentId) { const c = el("span", "tag"); c.title = "Sub-issue of " + i.parentId; c.append(tagIcon(ICON_PARENT), document.createTextNode(i.parentId)); out.push(c); }
    return out;
  }
  function areaTag(i) {
    const a = areaOf(i); if (!a) return null;
    const t = el("span", "area"); t.append(el("span", "dot " + a.toLowerCase()), document.createTextNode(a)); return t;
  }

  // ---------- markdown (escaped first; links only https) ----------
  const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  function inline(s) {
    let t = esc(s);
    const codes = [];
    t = t.replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return `\u0000${codes.length - 1}\u0000`; });
    t = t.replace(/\[([^\]]+)\]\((https:\/\/[^)\s]+)\)/g, (_, txt, url) => `<a href="${url}" target="_blank" rel="noopener">${txt}</a>`);
    t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/(^|[\s(])_([^_]+)_(?=[\s).,;:!?]|$)/g, "$1<em>$2</em>").replace(/(^|[\s(])\*([^*\s][^*]*)\*(?=[\s).,;:!?]|$)/g, "$1<em>$2</em>");
    return t.replace(/\u0000(\d+)\u0000/g, (_, n) => `<code>${codes[+n]}</code>`);
  }
  function markdown(src) {
    const lines = String(src).replace(/\r/g, "").split("\n");
    const out = []; let para = [], list = null;
    const flushP = () => { if (para.length) { out.push(`<p>${inline(para.join(" "))}</p>`); para = []; } };
    const flushL = () => { if (list) { out.push(`<${list.tag}>${list.items.map(x => `<li>${inline(x)}</li>`).join("")}</${list.tag}>`); list = null; } };
    for (const raw of lines) {
      const line = raw.trimEnd();
      let m;
      if (!line.trim()) { flushP(); flushL(); continue; }
      if ((m = line.match(/^\+\+\+\s*(.*)$/))) { flushP(); flushL(); out.push(m[1] ? `<details><summary>${inline(m[1])}</summary>` : "</details>"); continue; }
      if ((m = line.match(/^#{1,6}\s+(.*)$/))) { flushP(); flushL(); out.push(`<h4>${inline(m[1])}</h4>`); continue; }
      if ((m = line.match(/^\s*[-*]\s+(.*)$/))) { flushP(); if (!list || list.tag !== "ul") { flushL(); list = { tag: "ul", items: [] }; } list.items.push(m[1]); continue; }
      if ((m = line.match(/^\s*\d+[.)]\s+(.*)$/))) { flushP(); if (!list || list.tag !== "ol") { flushL(); list = { tag: "ol", items: [] }; } list.items.push(m[1]); continue; }
      flushL(); para.push(line.trim());
    }
    flushP(); flushL();
    const opens = out.filter(x => x.startsWith("<details>")).length, closes = out.filter(x => x === "</details>").length;
    for (let k = closes; k < opens; k++) out.push("</details>");
    return out.join("");
  }

  // ---------- errors ----------
  function errorCopy(err) {
    switch (err && err.code) {
      case "needs_reauth": return { text: "Linear needs to be reconnected. Reconnect it in claude.ai under Settings → Connectors, then reload.", tone: "bad" };
      case "server_not_connected": return { text: "Linear isn't connected to your claude.ai account. Add it under Settings → Connectors, then reload.", tone: "bad" };
      case "selection_required": return { text: "You have more than one Linear connector. Pick one in the prompt claude.ai shows, then reload.", tone: "warn" };
      case "not_in_manifest": return { text: "Linear access is turned off for this page.", tone: "warn", action: "permissions" };
      case "approval_required": case "consent_required": return { text: "This page needs your OK to read Linear.", tone: "warn", action: "approve" };
      case "blocked_by_policy": return { text: "Your organization's policy blocks Linear for this page.", tone: "bad" };
      case "server_unavailable": case "upstream_error": case "rate_limited": return { text: "Linear didn't answer just now. The list shows what it loaded last; press Refresh to try again.", tone: "warn" };
      case "tool_error": return { text: `Linear reported an error: ${(err && err.message) || "unknown"}`, tone: "bad" };
      case "not_granted": case "capability_disabled": case "capability_removed": return { text: "This view can't reach Linear. Open the page in claude.ai.", tone: "bad" };
      default: return { text: `Couldn't load from Linear (${(err && err.code) || "unknown error"}). Press Refresh to try again.`, tone: "warn" };
    }
  }
  function renderBanner() {
    const box = document.getElementById("banner");
    if (!state.error) { box.hidden = true; box.textContent = ""; return; }
    const c = errorCopy(state.error);
    box.className = "banner " + c.tone; box.textContent = "";
    box.append(el("p", null, c.text));
    if (c.action === "permissions") { const b = el("button", null, "Open permissions"); b.type = "button"; b.addEventListener("click", async () => { try { const p = await window.claude.use("permissions"); if (p) await p.manage(); } catch (e) {} }); box.append(b); }
    if (c.action === "approve") { const b = el("button", null, "Allow and load"); b.type = "button"; b.addEventListener("click", () => { b.disabled = true; loadOnce(); }); box.append(b); }
    box.hidden = false;
  }

  // ---------- render: the list ----------
  function render() {
    renderBanner();
    renderTabs();
    const open = viewIssues(view);
    const sub = document.getElementById("sub");
    const now = new Date();
    if (state.status === "loading") sub.textContent = "Loading your issues from Linear…";
    else if (state.status === "error" && !openIssues().length) sub.textContent = "Nothing loaded yet.";
    else sub.textContent = view === "week" ? `This week, ${weekRange()} · scheduled, not overdue`
      : view === "today" ? `Today, ${WD[now.getDay()]} ${now.getDate()} ${MON[now.getMonth()]} · due today`
      : view === "overdue" ? "Due date has passed and the issue is still open"
      : view === "unscheduled" ? "Open issues without a due date"
      : `Everything open on ${TEAM}${state.more ? " (first 250 shown)" : ""}`;
    const nf = Object.keys(filters).length;
    document.getElementById("count").textContent = state.status === "ok" || open.length ? `${open.length} issue${open.length === 1 ? "" : "s"}${nf ? " · filtered" : ""}` : "";
    renderChips();
    if (state.at) { const t = new Date(state.at); document.getElementById("fresh").textContent = `Updated ${pad(t.getHours())}:${pad(t.getMinutes())}`; }

    const root = document.getElementById("groups"); root.textContent = "";
    const wrap = el("div"); wrap.style.cssText = "display:grid;gap:18px";
    const group = (icon, name, items) => {
      if (!items.length) return;
      const g = el("section", "group"); g.setAttribute("aria-label", name);
      const head = el("div", "ghead"); if (icon) head.append(icon); head.append(el("span", "t", name), el("span", "n", String(items.length)));
      const ul = el("ul", "list");
      items.forEach(i => ul.append(row(i)));
      g.append(head, ul); wrap.append(g);
    };
    if (state.status === "ok" && !open.length) wrap.append(el("p", "empty", Object.keys(filters).length ? "No issues match these filters." : ({ today: "Nothing is due today.", week: "Nothing else is scheduled for this week.", overdue: "Nothing is overdue.", unscheduled: "Every open issue has a due date." }[view] || "No open issues on the board.")));
    if (groupBy === "none") {
      if (open.length) { const ul = el("ul", "list"); open.slice().sort(byPrioThenDue).forEach(i => ul.append(row(i))); wrap.append(ul); }
    } else if (groupBy === "status") {
      const names = [...new Map(open.slice().sort((a, b) => statusRank(a) - statusRank(b)).map(i => [statusName(i), 1])).keys()];
      names.forEach(n => group(null, n, open.filter(i => statusName(i) === n).sort(byPrioThenDue)));
    } else {
      GROUPS.forEach(([v, name]) => group(prioIcon(v), name, open.filter(i => prioOf(i) === v).sort(sorter)));
    }
    root.append(wrap);
    renderMenu();
    renderPanel();
    renderStatusMenu();
  }
  function row(i) {
    const li = el("li", "row" + (openId === i.id ? " sel" : ""));
    li.tabIndex = 0; li.setAttribute("role", "button"); li.setAttribute("aria-label", `${i.id} ${i.title}. Open details.`);
    li.addEventListener("click", () => openPanel(i.id));
    li.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openPanel(i.id); } });
    const main = el("div", "main");
    main.append(el("span", "title", i.title || "(untitled)"));
    const meta = el("div", "meta");
    rowTags(i).forEach(t => meta.append(t));
    if (meta.childNodes.length) main.append(meta);
    li.append(prioIcon(prioOf(i)), el("span", "id", i.id), statusButton(i, "row"), main);
    const acts = rowActions(i);
    if (acts.length) {
      const r = el("div", "right acts");
      acts.forEach(([label, fn]) => {
        const b = el("button", "act"); b.type = "button";
        b.title = label; b.setAttribute("aria-label", `${label}: ${i.id}`);
        b.append(actIcon(label));
        b.addEventListener("click", e => { e.stopPropagation(); fn(); });
        b.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") e.stopPropagation(); });
        r.append(b);
      });
      li.append(r);
    }
    return li;
  }

  // ---------- side panel ----------
  function openPanel(id) {
    openId = id;
    watchFull(id);
    render();
    const p = document.querySelector(".panel"); if (p) p.focus();
  }
  function closePanel() {
    const was = openId; openId = null;
    render();
    const r = was && [...document.querySelectorAll(".row")].find(x => x.getAttribute("aria-label").startsWith(was + " ")); if (r) r.focus();
  }
  document.addEventListener("keydown", e => { if (e.key === "Escape" && openId) closePanel(); });

  function watchFull(id) {
    if (!mcp || fullWatch.has(id)) return;
    fullWatch.set(id, mcp.watchTool(LINEAR, "get_issue", { id, fields: ["description"] }, ev => {
      if (ev.type === "data") { const p = ev.result && ev.result.payload; if (p && typeof p.description === "string") { full[id] = p.description; if (openId === id) render(); } }
    }, { cache: { staleTime: 60000, gcTime: 86400000 } }));
  }

  function renderPanel() {
    const host = document.getElementById("panelhost"); host.textContent = "";
    if (!openId) return;
    const i = byId(openId);
    const panel = el("aside", "panel"); panel.setAttribute("role", "dialog"); panel.setAttribute("aria-modal", "true"); panel.tabIndex = -1;
    const top = el("div", "p-top");
    const close = el("button", "quiet", "Close ×"); close.type = "button"; close.addEventListener("click", closePanel);
    top.append(el("span", "id", openId), close);
    panel.append(top);
    if (!i) {
      panel.append(el("p", "loading", state.status === "loading" ? "Loading…" : `${openId} isn't among the open issues on the board.`));
    } else {
      const h2 = el("h2", null, i.title || "(untitled)"); h2.id = "p-title"; panel.setAttribute("aria-labelledby", "p-title");
      panel.append(h2);
      const dl = el("dl", "facts");
      const fact = (k, ...v) => { const dd = el("dd"); v.filter(Boolean).forEach(x => dd.append(typeof x === "string" ? document.createTextNode(x) : x)); dl.append(el("dt", null, k), dd); };
      const pr = el("span", "area"); pr.append(prioIcon(prioOf(i)), document.createTextNode((i.priority && i.priority.name) || "No priority"));
      fact("Priority", pr);
      fact("Status", statusButton(i, "panel"), statusPill(i));
      if (areaOf(i)) fact("Area", areaTag(i));
      if (i.dueDate) fact("Check-in", dateTag(i));
      if (i.parentId) { const b = el("button", "linkbtn", byId(i.parentId) ? `${i.parentId} · ${byId(i.parentId).title}` : i.parentId); b.type = "button"; b.addEventListener("click", () => openPanel(i.parentId)); fact("Part of", b); }
      const kids = openIssues().filter(x => x.parentId === i.id).sort(sorter);
      if (kids.length) { const box = el("span"); box.style.cssText = "display:grid;gap:3px"; kids.forEach(k => { const b = el("button", "linkbtn", `${k.id} · ${k.title}`); b.type = "button"; b.addEventListener("click", () => openPanel(k.id)); box.append(b); }); fact("Sub-issues", box); }
      const f = folderOf(i); if (f) { const c = el("code", null, f); fact("Folder", c); }
      panel.append(dl);

      const next = lineOf(i, "Next step"), wait = lineOf(i, "Waiting on");
      if (next || wait) {
        const ball = el("div", "ball");
        if (next) { const d = el("div"); d.append(el("span", "k", "Next step"), el("span", null, next)); ball.append(d); }
        if (wait) { const d = el("div", "wait"); d.append(el("span", "k", "Waiting on"), el("span", null, wait)); ball.append(d); }
        panel.append(ball);
      }

      const descBox = el("div"); descBox.style.cssText = "display:grid;gap:8px";
      descBox.append(el("span", "k2", "Description"));
      const body = descOf(i);
      if (body.trim()) { const d = el("div", "desc"); d.innerHTML = markdown(body); descBox.append(d); }
      else descBox.append(el("p", "loading", "No description."));
      if (!full[i.id] && /\(truncated/.test(i.description || "")) descBox.append(el("p", "loading", "Loading the full description…"));
      panel.append(descBox);

      const a = el("a", "p-link", "Open in Linear ↗"); a.href = linearUrl(i); a.target = "_blank"; a.rel = "noopener";
      panel.append(a);
    }
    const scrim = el("div", "scrim"); scrim.addEventListener("click", closePanel);
    host.append(scrim, panel);
  }

  // ---------- data ----------
  const listInput = { team: TEAM, limit: 250, fields: FIELDS };
  function onList(ev) {
    if (ev.type === "data") {
      const p = ev.result && ev.result.payload;
      state.issues = p && Array.isArray(p.issues) ? p.issues : [];
      state.more = !!(p && p.hasNextPage);
      state.status = "ok"; state.error = null;
      state.at = (ev.result.cache && ev.result.cache.storedAt) || Date.now();
    } else {
      state.error = ev.error || { code: "upstream_error" };
      if (AUTHZ.has(state.error.code)) { state.issues = []; state.status = "error"; state.at = null; }
      else if (state.status !== "ok") state.status = "error";
    }
    render();
  }
  async function loadOnce() {
    if (!mcp) return;
    try { onList({ type: "data", result: await mcp.callTool(LINEAR, "list_issues", listInput) }); }
    catch (err) { onList({ type: "error", error: err }); }
  }
  document.getElementById("refresh").addEventListener("click", async () => {
    if (!mcp) return;
    document.getElementById("fresh").textContent = "Refreshing…";
    try { await mcp.invalidate(LINEAR); } catch (e) {}
    setTimeout(render, 4000);
  });

  render();
  (async () => {
    const m = await (window.claude && window.claude.use ? window.claude.use("mcp") : Promise.resolve(null));
    if (!m) { state.status = "error"; state.error = { code: "not_granted" }; document.getElementById("fresh").textContent = "Not connected"; render(); return; }
    mcp = m;
    mcp.watchTool(LINEAR, "list_issues", listInput, onList, { cache: { staleTime: 60000, gcTime: 86400000 }, refetchInterval: 300000 });
  })();
  setInterval(render, 10 * 60 * 1000); // Today and Week follow the clock past midnight
})();
</script>
