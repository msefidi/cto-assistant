<title>Mahyar's Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: tabs All · Unscheduled · Overdue · This week · Today over one list of open CTO issues grouped by priority, each row with Linear-style priority and status icons; a row opens its details in a side panel. Reads Linear live; the CTO statuses Unscheduled, This week and Today are the plan and drive the tabs; the status icon is a menu and the hover actions set the status, both written back to Linear. Overdue uses the due date (check-in date), which the page never changes. The Today tab has two columns: the Today issues (not timeboxed on top, timeboxed below) and today's agenda (Outlook events, read live, plus the timeboxes). Dragging an issue onto the agenda sets its slot; slots live in the page's own database (collection slots), never in Linear. */
:root {
  --bg: #f3f5f7; --surface: #ffffff; --sunk: #e9edf1; --ink: #18202b; --muted: #5b6574; --faint: #8a93a1; --line: #dde2e8; --line-soft: #edf0f3;

  --st-triage: #d9622b; --st-progress: #c99a06; --st-review: #2f9e5b; --st-wait: #9a7420; --st-done: #5e6ad2;
  --a-eviplex: #12676b; --a-platform: #3b6fb6; --a-medical: #8a4fb5; --a-cross: #8a94a3;
  --scrim: rgba(16, 20, 26, 0.28);
  --font-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10141a; --surface: #171c24; --sunk: #1d232c; --ink: #e5e9ef; --muted: #97a1af; --faint: #6c7684; --line: #29303b; --line-soft: #222832;
    --accent: #5db3ae; --accent-soft: #173233; --accent-ink: #0b1a1b;
    --urgent: #f0896b; --wait: #e2b65a; --wait-soft: #30281a; --warn: #e5ae4b; --bad: #f0896b;
    --st-triage: #f2945e; --st-progress: #f2c94c; --st-review: #4cb782; --st-wait: #d9a94a; --st-done: #8b93f0;
    --a-eviplex: #5db3ae; --a-platform: #7aa7e6; --a-medical: #c194e6; --a-cross: #8a94a3;
    --scrim: rgba(0, 0, 0, 0.5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10141a; --surface: #171c24; --sunk: #1d232c; --ink: #e5e9ef; --muted: #97a1af; --faint: #6c7684; --line: #29303b; --line-soft: #222832;
  --accent: #5db3ae; --accent-soft: #173233; --accent-ink: #0b1a1b;
  --urgent: #f0896b; --wait: #e2b65a; --wait-soft: #30281a; --warn: #e5ae4b; --bad: #f0896b;
  --st-triage: #f2945e; --st-progress: #f2c94c; --st-review: #4cb782; --st-wait: #d9a94a; --st-done: #8b93f0;
  --a-eviplex: #5db3ae; --a-platform: #7aa7e6; --a-medical: #c194e6; --a-cross: #8a94a3;
  --scrim: rgba(0, 0, 0, 0.5); color-scheme: dark;
}
* { box-sizing: border-box; }
html { scrollbar-gutter: stable; } /* keep the scrollbar's space, so short tabs don't shift sideways */
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 22px 48px;
}
.page { max-width: 1160px; margin: 0 auto; display: grid; gap: 18px; } /* one width for every tab, set by Today's two columns */
button { font: inherit; font-size: 0.84rem; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 6px 12px; cursor: pointer; }
button:hover { border-color: var(--accent); }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: flex-end; justify-content: space-between; }
h1 { font-weight: 600; font-size: 1.6rem; letter-spacing: -0.01em; line-height: 1.1; margin: 0; }
.sub { color: var(--muted); font-size: 0.86rem; margin-top: 4px; font-variant-numeric: tabular-nums; }
.tools { display: flex; gap: 10px; align-items: center; }

/* list toolbar: count left, round Filter and Display buttons right, filter chips below (like a Linear view) */
.listbar { position: relative; display: grid; gap: 8px; }
.toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 34px; }
.count { color: var(--muted); font-size: 0.9rem; font-variant-numeric: tabular-nums; }
.tb-right { display: flex; gap: 6px; }

.mi { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 8px; border: 0; border-radius: 6px; background: none; color: var(--ink); font-size: 0.86rem; text-align: left; cursor: pointer; }
.mi:hover { background: var(--sunk); border-color: transparent; }
.mi .n { margin-left: auto; font-family: var(--font-mono); font-size: 0.72rem; color: var(--faint); }

.mhead button { border: 0; background: none; padding: 0 4px; color: var(--muted); font-size: 0.9rem; }
.inline { display: flex; align-items: center; gap: 8px; padding: 2px 2px 2px 8px; white-space: nowrap; }
.inline label { font-size: 0.82rem; color: var(--muted); }
.sel { position: relative; display: inline-flex; }
.sel::after { content: ""; position: absolute; right: 10px; top: 50%; width: 5px; height: 5px; border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: translateY(-70%) rotate(45deg); pointer-events: none; }
.sel select { appearance: none; -webkit-appearance: none; font: inherit; font-size: 0.82rem; font-weight: 500; color: var(--ink); background: var(--sunk); border: 0; border-radius: 6px; padding: 4px 26px 4px 10px; cursor: pointer; }
.sel select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

.chip button:hover { background: var(--sunk); }

.chip .x { border-left: 1px solid var(--line-soft); color: var(--muted); padding: 3px 7px; }
.fresh { color: var(--muted); font-size: 0.8rem; }

.tabs { display: flex; gap: 2px; background: var(--sunk); border-radius: 10px; padding: 3px; justify-self: start; max-width: 100%; overflow-x: auto; }
.tabs a { text-decoration: none; color: var(--muted); font-weight: 500; font-size: 0.9rem; padding: 6px 16px; border-radius: 8px; white-space: nowrap; display: inline-flex; gap: 6px; align-items: baseline; }
.tabs a:hover { color: var(--ink); }
.tabs a[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(16, 20, 26, 0.12); }
.tabs .c { font-family: var(--font-mono); font-size: 0.74rem; color: var(--faint); }
.banner { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.banner.warn { border-color: var(--warn); } .banner.bad { border-color: var(--bad); }
.banner p { margin: 0; flex: 1 1 260px; min-width: 0; }

.group { display: grid; gap: 6px; }
.ghead { display: flex; gap: 8px; align-items: center; padding: 0 4px; }
.ghead .t { font-size: 0.74rem; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }
.ghead .n { font-family: var(--font-mono); font-size: 0.74rem; color: var(--faint); }
.list { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.row { display: grid; grid-template-columns: 18px 62px 22px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line-soft); cursor: pointer; }
.row:first-child { border-top: 0; }
.row:hover { background: var(--sunk); }
.row.sel { background: var(--accent-soft); }
.row .id { font-family: var(--font-mono); font-size: 0.76rem; color: var(--muted); }
.row .main { min-width: 0; display: grid; gap: 2px; }
.row .title { font-weight: 500; overflow-wrap: anywhere; }
.row .main { gap: 5px; }
.row .meta { display: flex; flex-wrap: wrap; gap: 5px; font-size: 0.74rem; color: var(--muted); align-items: center; }
.tag { display: inline-flex; gap: 5px; align-items: center; padding: 1px 8px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; line-height: 1.5; }
.tag.overdue { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
.tag.today { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.tag svg { width: 11px; height: 11px; flex: none; }
.row .right { display: flex; gap: 6px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
.act { width: 28px; height: 28px; padding: 0; display: inline-grid; place-items: center; border-radius: 7px; color: var(--muted); background: var(--surface); }
.act svg { width: 16px; height: 16px; display: block; }
.act:hover { color: var(--ink); border-color: var(--accent); }
@media (hover: hover) { .row .acts { opacity: 0; transition: opacity 0.12s; } .row:hover .acts, .row:focus-within .acts { opacity: 1; } }
@media (max-width: 620px) {
  .row { grid-template-columns: 18px 22px minmax(0, 1fr); }
  .row .id { display: none; }
  .row .right { grid-column: 3; justify-content: flex-start; }
}
.area { display: inline-flex; gap: 5px; align-items: center; }
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.dot.eviplex { background: var(--a-eviplex); } .dot.platform { background: var(--a-platform); } .dot.medical { background: var(--a-medical); } .dot.cross { background: var(--a-cross); }
.folder { display: inline-flex; gap: 4px; align-items: center; }
.pill { font-size: 0.72rem; padding: 2px 8px; border-radius: 999px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.pill.started { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.pill.waiting { background: var(--wait-soft); color: var(--wait); font-weight: 500; }
.date { font-size: 0.76rem; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.date.past { color: var(--faint); }
.prio { width: 16px; height: 16px; display: block; color: var(--muted); }
.prio.urgent { color: var(--urgent); }
.st { width: 14px; height: 14px; display: block; flex: none; color: var(--muted); }
.st.backlog { color: var(--faint); } .st.triage { color: var(--st-triage); } .st.started { color: var(--st-progress); } .st.review { color: var(--st-review); } .st.waiting { color: var(--st-wait); } .st.completed { color: var(--st-done); } .st.canceled { color: var(--faint); }
.stbtn { width: 22px; height: 22px; padding: 0; border: 0; border-radius: 6px; background: none; display: inline-grid; place-items: center; cursor: pointer; }
.stbtn:hover, .stbtn[aria-expanded="true"] { background: var(--line); border-color: transparent; }
.smenu { position: fixed; z-index: 40; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 4px; min-width: 200px; display: grid; gap: 1px; box-shadow: 0 8px 22px rgba(16, 20, 26, 0.16); }
.smenu .mnote { padding: 6px 8px; font-size: 0.84rem; color: var(--muted); max-width: 260px; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 50; max-width: calc(100% - 32px); display: flex; gap: 10px; align-items: center; background: var(--ink); color: var(--bg); border-radius: 10px; padding: 8px 10px 8px 14px; font-size: 0.86rem; box-shadow: 0 8px 22px rgba(16, 20, 26, 0.2); }
.toast button { background: none; border: 0; color: inherit; font-weight: 600; text-decoration: underline; padding: 2px 4px; }
.empty { color: var(--muted); margin: 0; padding: 18px; text-align: center; border: 1px dashed var(--line); border-radius: 12px; }

/* side panel */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 30; }
.panel { position: fixed; top: 0; right: 0; bottom: 0; width: min(480px, 100%); background: var(--surface); border-left: 1px solid var(--line); z-index: 31; overflow-y: auto;
  padding: calc(16px + env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)) 20px;
  display: grid; gap: 18px; align-content: start; box-shadow: -10px 0 30px rgba(16, 20, 26, 0.14); }
.p-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.p-top .id { font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); }
.panel h2 { font-weight: 600; font-size: 1.25rem; line-height: 1.3; margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 7px 16px; margin: 0; font-size: 0.88rem; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
.facts code { font-family: var(--font-mono); font-size: 0.8rem; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); font: inherit; cursor: pointer; text-align: left; }
.linkbtn:hover { text-decoration: underline; }
.ball { display: grid; gap: 10px; background: var(--sunk); border-radius: 10px; padding: 12px 14px; }
.ball div { display: grid; gap: 2px; }
.ball .k { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }
.ball .wait .k { color: var(--wait); }
.k2 { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }
.desc { font-size: 0.9rem; max-width: 65ch; overflow-wrap: anywhere; }
.desc > :first-child { margin-top: 0; }
.desc p, .desc ul, .desc ol { margin: 0 0 10px; }
.desc ul, .desc ol { padding-left: 20px; }
.desc h3, .desc h4 { font-size: 0.95rem; margin: 14px 0 6px; }
.desc code { font-family: var(--font-mono); font-size: 0.8rem; background: var(--sunk); padding: 1px 4px; border-radius: 4px; }
.desc a, .p-link { color: var(--accent); }
.desc details { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; margin: 0 0 10px; }
.desc summary { cursor: pointer; color: var(--muted); }
.loading { color: var(--faint); font-size: 0.86rem; }
.p-link { font-weight: 500; text-decoration: none; }
.p-link:hover { text-decoration: underline; }

/* Today: issues left, agenda right */
.today { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.tcol { display: grid; gap: 18px; min-width: 0; border-radius: 12px; }
.tcol.dropzone { outline: 2px dashed var(--accent); outline-offset: 6px; }
.hint { margin: 0; padding: 12px 14px; font-size: 0.84rem; color: var(--muted); border: 1px dashed var(--line); border-radius: 12px; }
.row[draggable="true"] { cursor: grab; }
.row.dragging, .blk.dragging { opacity: 0.4; }
/* Unscheduled: sub-issues fold under their parent */
.fold { display: inline-flex; gap: 5px; align-items: center; padding: 1px 8px 1px 6px; border: 1px solid var(--line); border-radius: 999px; background: var(--sunk); color: var(--ink); font-size: 0.74rem; font-weight: 500; line-height: 1.5; }
.fold:hover { border-color: var(--accent); color: var(--accent); }
.fold .chev { display: inline-block; font-size: 0.9rem; line-height: 1; transition: transform 0.12s; }
.fold.open .chev { transform: rotate(90deg); }
.row.child { background: color-mix(in srgb, var(--sunk) 45%, var(--surface)); border-top-color: var(--line-soft); }
.row.child:hover { background: var(--sunk); }
.tag.slot { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); font-family: var(--font-mono); font-size: 0.7rem; }
/* The agenda has a fixed height and scrolls inside itself, so it never makes the page longer. */
.agenda { position: sticky; top: 12px; height: min(600px, calc(100dvh - 32px)); min-height: 320px; display: flex; flex-direction: column; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 0 0; overflow: hidden; }
.agenda > * { flex: none; }
.agscroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; position: relative; padding: 0 12px 16px 0; border-top: 1px solid var(--line-soft); }
.ag-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 10px; padding-left: 14px; }
.ag-head .t { font-weight: 600; }
.ag-head .s { font-size: 0.78rem; color: var(--muted); }
.ag-note { margin: 0 0 0 14px; font-size: 0.82rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.ag-note button { font-size: 0.78rem; padding: 3px 9px; }
.allday { display: flex; flex-wrap: wrap; gap: 4px; margin-left: 52px; }
.allday .blk { position: static; }
.agrid { position: relative; margin: 12px 0 0 52px; }
.hr { position: absolute; left: 0; right: 0; border-top: 1px solid var(--line-soft); }
.hr span { position: absolute; left: -48px; top: -8px; width: 40px; text-align: right; font-family: var(--font-mono); font-size: 0.68rem; color: var(--faint); }
.blk { position: absolute; border-radius: 6px; padding: 3px 22px 3px 7px; font-size: 0.76rem; line-height: 1.25; overflow: hidden; display: flex; flex-direction: column; gap: 1px; text-decoration: none; color: var(--ink); min-width: 0; }
.blk .bt { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.blk .bm { color: var(--muted); font-family: var(--font-mono); font-size: 0.66rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.blk.ev:hover { border-left-color: var(--muted); }

.blk.ev.focus { background: transparent; border: 1px dashed color-mix(in srgb, var(--accent) 40%, var(--line)); border-left: 3px solid color-mix(in srgb, var(--accent) 50%, var(--line)); color: var(--muted); }
.blk.slot { background: var(--accent-soft); border-left: 3px solid var(--accent); cursor: grab; z-index: 2; box-shadow: 0 1px 2px rgba(16, 20, 26, 0.1); }

.blk .x:hover { background: var(--line); color: var(--ink); }
@media (hover: hover) { .blk.slot .x { opacity: 0; } .blk.slot:hover .x, .blk.slot:focus-within .x, .blk.slot:focus .x { opacity: 1; } }
.blk .grip { position: absolute; left: 0; right: 0; bottom: 0; height: 8px; cursor: ns-resize; touch-action: none; }

.now { position: absolute; left: -6px; right: 0; border-top: 2px solid var(--urgent); z-index: 4; pointer-events: none; }
.now::before { content: ""; position: absolute; left: 0; top: -5px; width: 8px; height: 8px; border-radius: 50%; background: var(--urgent); }
@media (max-width: 820px) {
  .today { grid-template-columns: minmax(0, 1fr); }
  .agenda { position: static; height: min(520px, calc(100dvh - 32px)); }
}
</style>

<div class="page">
  <header>
    <div>
      <h1>Mahyar's Board</h1>
      <div class="sub" id="sub">Loading your issues from Linear…</div>
    </div>
    <div class="tools">
      <span class="fresh" id="fresh"></span>
      <button type="button" id="refresh">Refresh</button>
    </div>
  </header>
  <nav class="tabs" id="tabs" aria-label="Views"></nav>
  <div class="listbar" id="listbar">
    <div class="toolbar">
      <span class="count" id="count"></span>
      <div class="tb-right">
        <button type="button" class="round" id="filter-btn" aria-label="Filter" title="Filter" aria-expanded="false"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M7 12h10M10 17h4"></path></svg></button>
        <button type="button" class="round" id="display-btn" aria-label="Display options" title="Display options" aria-expanded="false"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 8h6M14 8h6M4 16h10M18 16h2"></path><circle cx="12" cy="8" r="2"></circle><circle cx="16" cy="16" r="2"></circle></svg></button>
      </div>
    </div>
    <div class="chips" id="chips" hidden></div>
    <div class="menu" id="menu" role="dialog" aria-label="Options" hidden></div>
  </div>
  <div id="banner" hidden></div>
  <main id="groups"></main>
</div>
<div id="panelhost"></div>

<script>
(() => {
  const LINEAR = "Linear";
  const TEAM = "CTO";
  const FIELDS = ["id", "title", "url", "dueDate", "status", "statusType", "labels", "parentId", "priority", "updatedAt", "description"];
  const OPEN = new Set(["triage", "backlog", "unstarted", "started"]);
  const AREAS = ["Eviplex", "Platform", "Medical", "Cross"];
  const AUTHZ = new Set(["needs_reauth", "server_not_connected", "blocked_by_policy", "approval_required", "not_in_manifest", "selection_required", "not_granted", "capability_disabled", "capability_removed", "consent_required"]);
  const GROUPS = [[1, "Urgent"], [2, "High"], [3, "Medium"], [4, "Low"], [0, "No priority"]];
  const STATUS_ORDER = { started: 0, unstarted: 1, triage: 2, backlog: 3 };

  let mcp = null;
  const state = { status: "loading", issues: [], error: null, at: null, more: false };
  const full = {};             // id -> full description from get_issue
  const fullWatch = new Map(); // id -> unsubscribe
  let openId = null;

  // ---------- helpers ----------
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const pad = n => String(n).padStart(2, "0");
  const WD = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parseYmd = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const fmtDate = s => { const d = parseYmd(s); return `${WD[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`; };
  const labelsOf = i => i.labels || [];
  const areaOf = i => labelsOf(i).find(l => AREAS.includes(l)) || "";
  const hasFolder = i => labelsOf(i).includes("Folder");
  const prioOf = i => (i.priority && typeof i.priority.value === "number") ? i.priority.value : 0;
  const isWaiting = i => /waiting|delegated/i.test(i.status || "");
  const descOf = i => full[i.id] || i.description || "";
  const clean = s => s.replace(/…?\s*\(truncated[^)]*\)/g, "…").replace(/\*\*/g, "").replace(/`/g, "").replace(/<[^>]+>/g, "").replace(/\s+/g, " ").trim();
  const lineOf = (i, key) => { const m = descOf(i).match(new RegExp("\\*\\*" + key + "[^*]*:\\*\\*\\s*([^\\n]+)")); return m ? clean(m[1]) : ""; };
  function folderOf(i) {
    const m = descOf(i).match(/\*\*(?:Folder|Brief[^*]*):\*\*[^`\n]*`([^`]+)`/);
    return m ? m[1].replace(/\/$/, "") : (hasFolder(i) ? "has a folder" : "");
  }
  const safeUrl = u => /^https:\/\//i.test(String(u || "")) ? String(u) : null;
  const linearUrl = i => safeUrl(i.url) || `https://linear.app/fomf/issue/${encodeURIComponent(String(i.id).toLowerCase())}`;
  function sorter(a, b) {
    return (STATUS_ORDER[a.statusType] ?? 9) - (STATUS_ORDER[b.statusType] ?? 9)
      || (a.dueDate || "9999").localeCompare(b.dueDate || "9999")
      || String(a.id).localeCompare(String(b.id), undefined, { numeric: true });
  }
  const openIssues = () => state.issues.filter(i => OPEN.has(i.statusType));
  const byId = id => state.issues.find(i => i.id === id);

  // ---------- views: All · Unscheduled · Overdue · This week · Today ----------
  // The CTO statuses are the plan: Unscheduled (type backlog), This week (unstarted), Today (started).
  // Unscheduled, This week and Today each show the issues in that status, so every open issue sits in exactly one of them.
  // Overdue is the one date view: the due date (check-in date) has passed and the issue is still open, whatever its status.
  const VIEWS = [["all", "All"], ["unscheduled", "Unscheduled"], ["overdue", "Overdue"], ["week", "This week"], ["today", "Today"]];
  const PLAN = { unscheduled: { name: "Unscheduled", type: "backlog" }, week: { name: "This week", type: "unstarted" }, today: { name: "Today", type: "started" } };
  const planOf = i => i.statusType === "started" ? "today" : i.statusType === "unstarted" ? "week" : "unscheduled";
  const todayYmd = () => ymd(new Date());
  const isOverdue = i => !!i.dueDate && i.dueDate < todayYmd();
  const FILTERS = { all: () => true, overdue: isOverdue, unscheduled: i => planOf(i) === "unscheduled", week: i => planOf(i) === "week", today: i => planOf(i) === "today" };
  const viewIssues = v => openIssues().filter(FILTERS[v] || FILTERS.all).filter(matchFilters);
  let view = (() => { const h = location.hash.slice(1); if (VIEWS.some(([k]) => k === h)) return h; try { const s = localStorage.getItem("board.view"); if (VIEWS.some(([k]) => k === s)) return s; } catch (e) {} return "all"; })();
  function setView(v) {
    view = v;
    try { history.replaceState(null, "", "#" + v); } catch (e) {}
    try { localStorage.setItem("board.view", v); } catch (e) {}
    ensureToday();
    render();
  }
  window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (VIEWS.some(([k]) => k === h) && h !== view) { view = h; ensureToday(); render(); } });
  function weekRange() {
    const n = new Date(); const mon = new Date(n.getFullYear(), n.getMonth(), n.getDate() - ((n.getDay() + 6) % 7)); const sun = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + 6);
    return `${WD[1]} ${mon.getDate()} ${MON[mon.getMonth()]} – ${WD[0]} ${sun.getDate()} ${MON[sun.getMonth()]}`;
  }
  // Status groups by type: started (Today), unstarted (This week), backlog (Unscheduled).
  const statusName = i => isWaiting(i) ? "Waiting" : (i.status || "Other");
  const statusRank = i => (STATUS_ORDER[i.statusType] ?? 9) * 10 + (isWaiting(i) ? 5 : 0);
  const byPrioThenDue = (a, b) => ((prioOf(a) || 9) - (prioOf(b) || 9)) || (a.dueDate || "9999").localeCompare(b.dueDate || "9999") || String(a.id).localeCompare(String(b.id), undefined, { numeric: true });

  // ---------- display: group by (None · Priority · Status) ----------
  const GROUP_OPTS = [["none", "None"], ["priority", "Priority"], ["status", "Status"]];
  let groupBy = "priority";
  try { const g = localStorage.getItem("board.groupBy"); if (GROUP_OPTS.some(([k]) => k === g)) groupBy = g; } catch (e) {}
  function setGroupBy(g) { groupBy = g; try { localStorage.setItem("board.groupBy", g); } catch (e) {} render(); }

  // ---------- folding: which parents show their sub-issues (Unscheduled tab); folded by default ----------
  const unfolded = new Set();
  try { JSON.parse(localStorage.getItem("board.unfolded") || "[]").forEach(id => { if (typeof id === "string") unfolded.add(id); }); } catch (e) {}
  function toggleFold(id) {
    unfolded.has(id) ? unfolded.delete(id) : unfolded.add(id);
    try { localStorage.setItem("board.unfolded", JSON.stringify([...unfolded])); } catch (e) {}
    render();
    const b = [...document.querySelectorAll(".row")].find(x => x.getAttribute("aria-label").startsWith(id + " "));
    const f = b && b.querySelector(".fold"); if (f) f.focus();
  }

  // ---------- filters: added from the Filter button, shown as chips above the list ----------
  const FFIELDS = {
    status: { name: "Status", of: statusName, options: () => [...new Map(openIssues().slice().sort((a, b) => statusRank(a) - statusRank(b)).map(i => [statusName(i), statusName(i)])).entries()] },
    priority: { name: "Priority", of: i => String(prioOf(i)), options: () => GROUPS.map(([v, n]) => [String(v), n]) },
    area: { name: "Area", of: i => areaOf(i) || "none", options: () => [...AREAS.map(a => [a, a]), ["none", "No area"]] },
    folder: { name: "Folder", of: i => hasFolder(i) ? "yes" : "no", options: () => [["yes", "Has a folder"], ["no", "No folder"]] },
  };
  let filters = {};
  try { const f = JSON.parse(localStorage.getItem("board.filters") || "{}"); Object.keys(FFIELDS).forEach(k => { if (Array.isArray(f[k]) && f[k].length) filters[k] = f[k].map(String); }); } catch (e) {}
  const saveFilters = () => { try { localStorage.setItem("board.filters", JSON.stringify(filters)); } catch (e) {} };
  function matchFilters(i) { return Object.entries(filters).every(([k, vals]) => !vals.length || vals.includes(FFIELDS[k].of(i))); }
  function toggleFilter(field, val) {
    const cur = new Set(filters[field] || []);
    cur.has(val) ? cur.delete(val) : cur.add(val);
    if (cur.size) filters[field] = [...cur]; else delete filters[field];
    saveFilters(); render();
  }
  function removeFilter(field) { delete filters[field]; saveFilters(); if (menu && menu.field === field) menu = null; render(); }

  // ---------- one menu at a time: display, filter fields, or one field's values ----------
  let menu = null; // { type: "display" | "fields" | "values", field?, anchor: element id }
  const menuEl = document.getElementById("menu");
  function openMenu(m) { if (smenu) { smenu = null; smenuEl.hidden = true; } menu = (menu && menu.type === m.type && menu.field === m.field && menu.anchor === m.anchor) ? null : m; renderMenu(); }
  function closeMenu(focusBack) { if (!menu) return; const a = menu.anchor; menu = null; renderMenu(); if (focusBack) { const b = document.getElementById(a); if (b) b.focus(); } }
  document.getElementById("filter-btn").addEventListener("click", e => { e.stopPropagation(); openMenu({ type: "fields", anchor: "filter-btn" }); });
  document.getElementById("display-btn").addEventListener("click", e => { e.stopPropagation(); openMenu({ type: "display", anchor: "display-btn" }); });
  menuEl.addEventListener("click", e => e.stopPropagation());
  document.addEventListener("click", () => closeMenu(false));
  document.addEventListener("keydown", e => { if (e.key === "Escape" && menu) { e.stopImmediatePropagation(); closeMenu(true); } }, true);

  function renderMenu() {
    ["filter-btn", "display-btn"].forEach(id => document.getElementById(id).setAttribute("aria-expanded", String(!!menu && menu.anchor === id)));
    document.getElementById("filter-btn").classList.toggle("on", Object.keys(filters).length > 0);
    menuEl.textContent = "";
    if (!menu) { menuEl.hidden = true; return; }
    const pool = openIssues().filter(FILTERS[view] || FILTERS.all);
    if (menu.type === "display") {
      const row = el("div", "inline");
      const lab = el("label", null, "Group by"); lab.htmlFor = "group-by";
      const wrap = el("span", "sel"); const s = el("select"); s.id = "group-by";
      GROUP_OPTS.forEach(([k, n]) => { const o = el("option", null, n); o.value = k; s.append(o); });
      s.value = groupBy;
      s.addEventListener("change", () => setGroupBy(s.value));
      wrap.append(s); row.append(lab, wrap); menuEl.append(row);
    } else if (menu.type === "fields") {
      Object.entries(FFIELDS).forEach(([k, f]) => {
        const b = el("button", "mi"); b.type = "button";
        b.append(document.createTextNode(f.name));
        b.append(el("span", "chev", (filters[k] || []).length ? `${filters[k].length} ›` : "›"));
        b.addEventListener("click", () => { menu = { type: "values", field: k, anchor: menu.anchor }; renderMenu(); });
        menuEl.append(b);
      });
    } else {
      const f = FFIELDS[menu.field];
      const head = el("div", "mhead");
      if (menu.anchor === "filter-btn") { const back = el("button", null, "‹"); back.type = "button"; back.setAttribute("aria-label", "Back to filters"); back.addEventListener("click", () => { menu = { type: "fields", anchor: "filter-btn" }; renderMenu(); }); head.append(back); }
      head.append(document.createTextNode(f.name));
      menuEl.append(head);
      const chosen = new Set(filters[menu.field] || []);
      f.options().forEach(([val, name], n) => {
        const lab = el("label", "mi"); const id = `opt-${menu.field}-${n}`;
        const cb = el("input"); cb.type = "checkbox"; cb.id = id; cb.checked = chosen.has(val);
        cb.addEventListener("change", () => { toggleFilter(menu.field, val); const again = document.getElementById(id); if (again) again.focus(); });
        lab.append(cb);
        if (menu.field === "priority") lab.append(prioIcon(+val));
        if (menu.field === "area" && val !== "none") lab.append(el("span", "dot " + val.toLowerCase()));
        lab.append(document.createTextNode(name), el("span", "n", String(pool.filter(i => f.of(i) === val).length)));
        menuEl.append(lab);
      });
    }
    menuEl.hidden = false;
    // place the menu under its anchor, kept inside the list area
    const anchor = document.getElementById(menu.anchor), host = document.getElementById("listbar");
    if (!anchor) { menuEl.hidden = true; return; }
    const ar = anchor.getBoundingClientRect(), hr = host.getBoundingClientRect();
    menuEl.style.top = (ar.bottom - hr.top + 6) + "px";
    const alignRight = menu.anchor === "filter-btn" || menu.anchor === "display-btn";
    if (alignRight) { menuEl.style.left = "auto"; menuEl.style.right = Math.max(0, hr.right - ar.right) + "px"; }
    else { menuEl.style.right = "auto"; menuEl.style.left = Math.max(0, ar.left - hr.left) + "px"; }
  }

  function renderChips() {
    const box = document.getElementById("chips"); box.textContent = "";
    const active = Object.keys(FFIELDS).filter(k => (filters[k] || []).length);
    box.hidden = !active.length;
    active.forEach(k => {
      const f = FFIELDS[k], names = new Map(f.options());
      const vals = filters[k].map(v => names.get(v) || v);
      const chip = el("span", "chip");
      const body = el("button"); body.type = "button"; body.id = "chip-" + k;
      body.append(el("span", "f", f.name), el("span", "op", vals.length > 1 ? "is any of" : "is"), document.createTextNode(vals.join(", ")));
      body.addEventListener("click", e => { e.stopPropagation(); openMenu({ type: "values", field: k, anchor: "chip-" + k }); });
      const x = el("button", "x", "×"); x.type = "button"; x.setAttribute("aria-label", `Remove ${f.name} filter`);
      x.addEventListener("click", e => { e.stopPropagation(); removeFilter(k); });
      chip.append(body, x); box.append(chip);
    });
    if (active.length > 1) { const c = el("button", "quiet", "Clear"); c.type = "button"; c.addEventListener("click", e => { e.stopPropagation(); filters = {}; saveFilters(); menu = null; render(); }); box.append(c); }
  }

  function renderTabs() {
    const nav = document.getElementById("tabs"); nav.textContent = "";
    const loaded = state.status === "ok";
    VIEWS.forEach(([k, name]) => {
      const a = el("a"); a.href = "#" + k;
      a.setAttribute("aria-current", view === k ? "page" : "false");
      a.append(document.createTextNode(name));
      if (loaded) a.append(el("span", "c", String(viewIssues(k).length)));
      a.addEventListener("click", e => { e.preventDefault(); setView(k); });
      nav.append(a);
    });
  }

  const SVG_NS = "http://www.w3.org/2000/svg";
  function prioIcon(v) {
    const s = document.createElementNS(SVG_NS, "svg");
    s.setAttribute("viewBox", "0 0 16 16"); s.setAttribute("class", "prio" + (v === 1 ? " urgent" : "")); s.setAttribute("aria-hidden", "true");
    const add = (tag, attrs) => { const n = document.createElementNS(SVG_NS, tag); Object.entries(attrs).forEach(([k, val]) => n.setAttribute(k, val)); s.append(n); };
    if (v === 1) { add("rect", { x: 1, y: 1, width: 14, height: 14, rx: 3, fill: "currentColor" }); add("rect", { x: 7, y: 4, width: 2, height: 5.5, rx: 1, style: "fill: var(--surface)" }); add("rect", { x: 7, y: 10.5, width: 2, height: 2, rx: 1, style: "fill: var(--surface)" }); }
    else if (v === 0) { [2, 7, 12].forEach(x => add("rect", { x, y: 7.25, width: 2.5, height: 1.5, rx: 0.75, fill: "currentColor", opacity: 0.6 })); }
    else { const lit = { 2: 3, 3: 2, 4: 1 }[v] || 0; [[2, 9, 5], [6.5, 6, 8], [11, 3, 11]].forEach(([x, y, h], k) => add("rect", { x, y, width: 3, height: h, rx: 1, fill: "currentColor", opacity: k < lit ? 1 : 0.25 })); }
    return s;
  }
  // Linear-style status icons: Backlog dashed ring, Triage filled with arrows, Todo empty ring,
  // In Progress ring with a half pie, In Review (green) and Waiting (amber) rings with a three-quarter pie.
  const statusKind = (name, type) => /waiting|delegated/i.test(name || "") ? "waiting" : (type === "started" && /review/i.test(name || "")) ? "review" : (type || "unstarted");
  const statusIcon = i => statusGlyph(i.status, i.statusType);
  function statusGlyph(name, type) {
    const s = document.createElementNS(SVG_NS, "svg");
    const kind = statusKind(name, type);
    s.setAttribute("viewBox", "0 0 14 14"); s.setAttribute("class", "st " + kind); s.setAttribute("aria-hidden", "true");
    const add = (tag, attrs) => { const n = document.createElementNS(SVG_NS, tag); Object.entries(attrs).forEach(([k, val]) => n.setAttribute(k, val)); s.append(n); return n; };
    const ring = extra => add("circle", Object.assign({ cx: 7, cy: 7, r: 6, fill: "none", stroke: "currentColor", "stroke-width": 1.5 }, extra || {}));
    const pie = f => { const a = f * 2 * Math.PI, x = 7 + 3 * Math.sin(a), y = 7 - 3 * Math.cos(a); add("path", { d: `M7 7 L7 4 A3 3 0 ${f > 0.5 ? 1 : 0} 1 ${x.toFixed(2)} ${y.toFixed(2)} Z`, fill: "currentColor" }); };
    if (kind === "backlog") ring({ "stroke-dasharray": "1.4 1.75" });
    else if (kind === "triage") { add("circle", { cx: 7, cy: 7, r: 6.5, fill: "currentColor" }); add("path", { d: "M4.2 5.6h5.2M7.9 4l1.6 1.6-1.6 1.6M9.8 8.4H4.6M6.1 6.8 4.5 8.4 6.1 10", fill: "none", style: "stroke: var(--surface)", "stroke-width": 1.2, "stroke-linecap": "round", "stroke-linejoin": "round" }); }
    else if (kind === "started") { ring(); pie(0.5); }
    else if (kind === "waiting" || kind === "review") { ring(); pie(0.75); }
    else if (kind === "completed") { add("circle", { cx: 7, cy: 7, r: 6.5, fill: "currentColor" }); add("path", { d: "M4.3 7.2 6.2 9 9.7 5.2", fill: "none", style: "stroke: var(--surface)", "stroke-width": 1.5, "stroke-linecap": "round", "stroke-linejoin": "round" }); }
    else if (kind === "canceled") { add("circle", { cx: 7, cy: 7, r: 6.5, fill: "currentColor" }); add("path", { d: "M5 5l4 4M9 5l-4 4", fill: "none", style: "stroke: var(--surface)", "stroke-width": 1.5, "stroke-linecap": "round" }); }
    else ring();
    return s;
  }
  function statusPill(i) {
    const cls = isWaiting(i) ? "pill waiting" : i.statusType === "started" ? "pill started" : "pill";
    return el("span", cls, isWaiting(i) ? "Waiting" : (i.status || ""));
  }
  // ---------- status: the icon is a button; picking a status saves it to Linear ----------
  function statusButton(i, where) {
    const b = el("button", "stbtn"); b.type = "button";
    b.dataset.id = i.id; b.dataset.where = where;
    b.title = "Change status"; b.setAttribute("aria-label", `Status: ${i.status || "unknown"}. Change status`);
    b.setAttribute("aria-haspopup", "menu"); b.setAttribute("aria-expanded", String(!!smenu && smenu.id === i.id && smenu.where === where));
    b.append(statusIcon(i));
    b.addEventListener("click", e => { e.stopPropagation(); toggleStatusMenu(i.id, where, b); });
    b.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") e.stopPropagation(); });
    return b;
  }
  let statuses = null, statusesErr = null, statusesLoading = false;
  const TYPE_ORDER = { backlog: 0, unstarted: 1, started: 2, completed: 3, canceled: 4 }; // Triage and Duplicate are not offered
  const startedRank = n => /progress/i.test(n) ? 0 : /review/i.test(n) ? 1 : /waiting|delegated/i.test(n) ? 2 : 3;
  async function loadStatuses() {
    if (statuses || statusesLoading || !mcp) return;
    statusesLoading = true; statusesErr = null;
    try {
      const r = await mcp.callTool(LINEAR, "list_issue_statuses", { team: TEAM });
      const p = r && r.payload;
      const arr = Array.isArray(p) ? p : (p && (p.statuses || p.issueStatuses || p.nodes)) || [];
      statuses = arr.filter(x => x && x.id && x.name && x.type in TYPE_ORDER)
        .sort((a, b) => (TYPE_ORDER[a.type] - TYPE_ORDER[b.type]) || (startedRank(a.name) - startedRank(b.name)) || a.name.localeCompare(b.name));
    } catch (err) { statusesErr = err; }
    statusesLoading = false;
    renderStatusMenu();
  }
  let smenu = null; // { id, where, left, top, bottom, focus }
  const smenuEl = el("div", "smenu"); smenuEl.setAttribute("role", "menu"); smenuEl.setAttribute("aria-label", "Status"); smenuEl.hidden = true;
  document.body.append(smenuEl);
  smenuEl.addEventListener("click", e => e.stopPropagation());
  smenuEl.addEventListener("keydown", e => {
    if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
    e.preventDefault();
    const items = [...smenuEl.querySelectorAll("button")], k = items.indexOf(document.activeElement);
    const next = items[(k + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length]; if (next) next.focus();
  });
  document.addEventListener("click", () => { if (smenu) closeStatusMenu(false); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && smenu) { e.stopImmediatePropagation(); closeStatusMenu(true); } }, true);
  window.addEventListener("scroll", () => { if (smenu) closeStatusMenu(false); }, true);
  window.addEventListener("resize", () => { if (smenu) closeStatusMenu(false); });
  function toggleStatusMenu(id, where, btn) {
    if (smenu && smenu.id === id && smenu.where === where) { closeStatusMenu(true); return; }
    closeMenu(false);
    const r = btn.getBoundingClientRect();
    smenu = { id, where, left: r.left, top: r.bottom + 4, bottom: r.top - 4, focus: true };
    loadStatuses();
    render();

      const fact = (k, ...v) => { const dd = el("dd"); v.filter(Boolean).forEach(x => dd.append(typeof x === "string" ? document.createTextNode(x) : x)); dl.append(el("dt", null, k), dd); };
      const pr = el("span", "area"); pr.append(prioIcon(prioOf(i)), document.createTextNode((i.priority && i.priority.name) || "No priority"));
      fact("Priority", pr);
      fact("Status", statusButton(i, "panel"), statusPill(i));
      if (areaOf(i)) fact("Area", areaTag(i));
      if (i.dueDate) fact("Check-in", dateTag(i));
      if (i.parentId) { const b = el("button", "linkbtn", byId(i.parentId) ? `${i.parentId} · ${byId(i.parentId).title}` : i.parentId); b.type = "button"; b.addEventListener("click", () => openPanel(i.parentId)); fact("Part of", b); }
      const kids = openIssues().filter(x => x.parentId === i.id).sort(sorter);
      if (kids.length) { const box = el("span"); box.style.cssText = "display:grid;gap:3px"; kids.forEach(k => { const b = el("button", "linkbtn", `${k.id} · ${k.title}`); b.type = "button"; b.addEventListener("click", () => openPanel(k.id)); box.append(b); }); fact("Sub-issues", box); }
      const f = folderOf(i); if (f) { const c = el("code", null, f); fact("Folder", c); }
      panel.append(dl);

      const next = lineOf(i, "Next step"), wait = lineOf(i, "Waiting on");
      if (next || wait) {
        const ball = el("div", "ball");
        if (next) { const d = el("div"); d.append(el("span", "k", "Next step"), el("span", null, next)); ball.append(d); }
        if (wait) { const d = el("div", "wait"); d.append(el("span", "k", "Waiting on"), el("span", null, wait)); ball.append(d); }
        panel.append(ball);
      }

      const descBox = el("div"); descBox.style.cssText = "display:grid;gap:8px";
      descBox.append(el("span", "k2", "Description"));
      const body = descOf(i);
      if (body.trim()) { const d = el("div", "desc"); d.innerHTML = markdown(body); descBox.append(d); }
      else descBox.append(el("p", "loading", "No description."));
      if (!full[i.id] && /\(truncated/.test(i.description || "")) descBox.append(el("p", "loading", "Loading the full description…"));
      panel.append(descBox);

      const a = el("a", "p-link", "Open in Linear ↗"); a.href = linearUrl(i); a.target = "_blank"; a.rel = "noopener";

    host.append(scrim, panel);
  }

  // ---------- Today: timeboxes and the agenda ----------
  // A timebox is a slot today for one issue, kept in the page's database (collection "slots",
  // doc "<yyyy-mm-dd>_<issue id>", fields date, issue, title, start, end in minutes after midnight).
  // Nothing about it is written to Linear. The agenda shows today's Outlook events beside the slots;
  // events in the Outlook category "To Do" are your own focus blocks and do not count as busy.
  const M365 = "Microsoft 365";
  const PX = 64 / 60;          // pixels per minute
  const SNAP = 15, DEFAULT_LEN = 60;
  let db = null, dbState = "loading", dbErr = null; // loading | ok | slow | error | off
  const slots = new Map();     // issue id -> { start, end, title }
  let slotsDay = null, slotsUnsub = null;
  const cal = { status: "loading", events: [], error: null, at: null };
  let calDay = null, calUnsub = null;
  let drag = null, dragging = false, renderPending = false, resizing = null, justResized = 0;
  let agendaRange = { h0: 8, h1: 19 }, ghostEl = null, nowEl = null, agendaScroll = null, focusSlot = null;
  const fmtMin = m => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
  const fmtLen = m => (m >= 60 ? `${Math.floor(m / 60)}h` : "") + (m % 60 ? `${m >= 60 ? " " : ""}${m % 60}m` : "");
  const minutesNow = () => { const n = new Date(); return n.getHours() * 60 + n.getMinutes(); };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  function ensureToday() {
    if (view !== "today") return;
    watchSlots(); watchCal();
  }
  function watchSlots() {
    if (!db) return;
    const day = todayYmd();
    if (slotsDay === day && slotsUnsub) return;
    if (slotsUnsub) slotsUnsub();
    slotsDay = day; slots.clear(); dbState = "loading";
    const timer = setTimeout(() => { if (dbState === "loading") { dbState = "slow"; render(); } }, 10000);
    slotsUnsub = db.collection("slots").where("date", "==", day).onSnapshot(snap => {
      if (!snap.metadata.fromCache) clearTimeout(timer);
      slots.clear();
      snap.docs.forEach(d => {
        const x = d.data();
        if (x && typeof x.issue === "string" && Number.isFinite(x.start) && Number.isFinite(x.end) && x.end > x.start)
          slots.set(x.issue, { start: x.start, end: x.end, title: typeof x.title === "string" ? x.title : "" });
      });
      if (!snap.metadata.fromCache || dbState === "loading") dbState = "ok";
      render();
    }, err => { clearTimeout(timer); dbState = "error"; dbErr = err; slotsUnsub = null; render(); });
  }
  // One write at a time per document.
  const writeQ = new Map();
  function queueWrite(key, fn) { const next = (writeQ.get(key) || Promise.resolve()).catch(() => {}).then(fn); writeQ.set(key, next); return next; }
  function dbErrorText(err) {
    switch (err && err.code) {
      case "quota_exceeded": return "The board's storage is full.";
      case "invalid_argument": return "Only the board's owner can change timeboxes.";
      case "revoked": case "not_granted": case "capability_disabled": return "This view can't save timeboxes.";
      default: return "Try again.";
    }
  }
  // Set (slot) or clear (null) one issue's timebox today, shown at once, with Undo.
  async function saveSlot(id, slot, msg, isUndo) {
    if (!db) return;
    const day = slotsDay || todayYmd(), prev = slots.get(id) || null;
    if (slot) slots.set(id, slot); else slots.delete(id);
    render();
    const ref = db.collection("slots").doc(`${day}_${id}`);
    try {
      await queueWrite(ref.path, () => slot ? ref.set({ date: day, issue: id, title: slot.title || "", start: slot.start, end: slot.end }) : ref.delete());
      if (msg) showToast(msg, isUndo ? null : () => saveSlot(id, prev, `${id} restored`, true));
    } catch (err) {
      if (prev) slots.set(id, prev); else slots.delete(id);
      render();
      showToast(`${id} timebox not saved. ${dbErrorText(err)}`);
    }
  }
  const titleFor = id => { const i = byId(id); return (i && i.title) || (slots.get(id) || {}).title || ""; };
  function placeSlot(id, start, len) {
    const old = slots.get(id);
    if (old && old.start === start && old.end === start + len) return;
    saveSlot(id, { start, end: start + len, title: titleFor(id) }, `${id} ${old ? "moved to" : "timeboxed"} ${fmtMin(start)}–${fmtMin(start + len)}`);
  }
  // Next free stretch today from now (busy = Outlook events that are busy and not focus blocks, plus other slots).
  function nextFree(len) {
    const busy = [...cal.events.filter(e => !e.allDay && !e.free && !e.focus).map(e => [e.start, e.end]), ...[...slots.values()].map(s => [s.start, s.end])];
    for (let t = Math.max(Math.ceil(minutesNow() / SNAP) * SNAP, 8 * 60); t + len <= 20 * 60; t += SNAP)
      if (!busy.some(([a, b]) => a < t + len && t < b)) return t;
    return null;
  }
  function autoBox(i) {
    for (const len of [DEFAULT_LEN, 30]) { const t = nextFree(len); if (t != null) return placeSlot(i.id, t, len); }
    showToast("No free half hour left today before 20:00. Drag it onto the agenda instead.");
  }

  // Outlook: today's events, read live. Times come as {dateTime, timeZone}; "UTC" is converted to local time.
  function watchCal() {
    if (!mcp) return;
    const day = todayYmd();
    if (calDay === day && calUnsub) return;
    if (calUnsub) calUnsub();
    calDay = day; cal.status = "loading"; cal.events = []; cal.error = null;
    const d0 = parseYmd(day), d1 = new Date(d0.getFullYear(), d0.getMonth(), d0.getDate() + 1);
    const input = { query: "*", afterDateTime: d0.toISOString(), beforeDateTime: d1.toISOString(), limit: 25, offset: 0, order: "oldest" };
    calUnsub = mcp.watchTool(M365, "outlook_calendar_search", input, ev => {
      if (ev.type === "data") { cal.events = parseEvents(ev.result, d0); cal.status = "ok"; cal.error = null; cal.at = (ev.result.cache && ev.result.cache.storedAt) || Date.now(); }
      else {
        cal.error = ev.error || { code: "upstream_error" };
        if (AUTHZ.has(cal.error.code)) { cal.events = []; cal.status = "error"; } else if (cal.status !== "ok") cal.status = "error";
      }
      render();
    }, { cache: { staleTime: 60000, gcTime: 86400000 }, refetchInterval: 300000 });
  }
  async function approveCal() {
    try { await mcp.callTool(M365, "outlook_calendar_search", { query: "*", afterDateTime: parseYmd(todayYmd()).toISOString(), limit: 1, offset: 0 }); } catch (e) {}
    if (calUnsub) calUnsub(); calUnsub = null; calDay = null; watchCal();
  }
  // The connector may answer with one JSON value or several event objects back to back.
  function parseJsonStream(s) {
    try { return [JSON.parse(s)]; } catch (e) {}
    const out = []; let depth = 0, inStr = false, bs = false, from = -1;
    for (let k = 0; k < s.length; k++) {
      const c = s[k];
      if (inStr) { if (bs) bs = false; else if (c === "\\") bs = true; else if (c === '"') inStr = false; continue; }
      if (c === '"') inStr = true;
      else if (c === "{") { if (depth === 0) from = k; depth++; }
      else if (c === "}" && depth > 0) { depth--; if (depth === 0 && from >= 0) { try { out.push(JSON.parse(s.slice(from, k + 1))); } catch (e) {} from = -1; } }
    }
    return out;
  }
  function collectEvents(x, out, depth) {
    if (x == null || depth > 5) return;
    if (typeof x === "string") { parseJsonStream(x).forEach(v => collectEvents(v, out, depth + 1)); return; }
    if (Array.isArray(x)) { x.forEach(v => collectEvents(v, out, depth + 1)); return; }
    if (typeof x === "object") {
      if (x.start && x.end && "subject" in x) { out.push(x); return; }
      Object.values(x).forEach(v => { if (v && typeof v === "object") collectEvents(v, out, depth + 1); });
    }
  }
  function evTime(t) {
    if (!t || typeof t.dateTime !== "string") return null;
    const s = t.dateTime.replace(/(\.\d{3})\d*$/, "$1").replace(/Z$/, "");
    const d = /^(utc|gmt|z)$/i.test(t.timeZone || "") || /Z$/.test(t.dateTime) ? new Date(s + "Z") : new Date(s);
    return isNaN(d) ? null : d;
  }
  function parseEvents(result, d0) {
    // The connector sends one text block per event, and `payload` holds only the first block,
    // so read every block as well (duplicates are dropped below).
    const raw = [];
    if (result && result.structuredContent != null) collectEvents(result.structuredContent, raw, 0);
    ((result && result.content) || []).forEach(b => { if (b && b.type === "text") collectEvents(b.text, raw, 0); });
    if (!raw.length && result) collectEvents(result.payload, raw, 0);
    const seen = new Set(), out = [], dayStart = d0.getTime(), dayEnd = new Date(d0.getFullYear(), d0.getMonth(), d0.getDate() + 1).getTime();
    raw.forEach(e => {
      if (e.isCancelled) return;
      const key = String(e.id || `${e.subject}|${JSON.stringify(e.start)}`); if (seen.has(key)) return; seen.add(key);
      const s = evTime(e.start), en = evTime(e.end); if (!s || !en) return;
      if (en.getTime() <= dayStart || s.getTime() >= dayEnd) return;
      out.push({
        id: key, subject: String(e.subject || "(no title)"),
        start: Math.max(0, Math.round((s.getTime() - dayStart) / 60000)), end: Math.min(1440, Math.round((en.getTime() - dayStart) / 60000)),
        allDay: !!e.isAllDay, free: e.showAs === "free",
        focus: Array.isArray(e.categories) && e.categories.some(c => /^to ?do$/i.test(String(c))),
        url: safeUrl(e.webLink), location: typeof e.location === "string" ? e.location : "",
      });
    });
    return out.sort((a, b) => a.start - b.start);
  }

  // Overlapping blocks share the width, like a calendar day view.
  function layoutLanes(items) {
    const sorted = items.slice().sort((a, b) => a.start - b.start || b.end - a.end);
    let cluster = [], clusterEnd = -1;
    const flush = () => {
      const cols = [];
      cluster.forEach(it => { let c = cols.findIndex(end => end <= it.start); if (c < 0) { c = cols.length; cols.push(0); } cols[c] = it.end; it.col = c; });
      cluster.forEach(it => { it.cols = cols.length; });
      cluster = []; clusterEnd = -1;
    };
    sorted.forEach(it => { if (cluster.length && it.start >= clusterEnd) flush(); cluster.push(it); clusterEnd = Math.max(clusterEnd, it.end); });
    if (cluster.length) flush();
    return sorted;
  }

  // ---------- drag and drop: list -> agenda sets the slot, agenda -> agenda moves it, agenda -> list clears it ----------
  function startDrag(e, id, from, node, grab) {
    if (resizing || !db) { e.preventDefault(); return; }
    const s = slots.get(id);
    drag = { id, from, len: s ? s.end - s.start : DEFAULT_LEN, grab };
    dragging = true;
    try { e.dataTransfer.setData("text/plain", id); e.dataTransfer.effectAllowed = "move"; } catch (err) {}
    requestAnimationFrame(() => {
      node.classList.add("dragging");
      if (from === "slot") { const l = document.querySelector(".tcol"); if (l) l.classList.add("dropzone"); }
    });
  }
  function endDrag() {
    if (!dragging) return;
    drag = null; dragging = false;
    if (ghostEl) ghostEl.hidden = true;
    document.querySelectorAll(".dragging, .dropzone").forEach(n => n.classList.remove("dragging", "dropzone"));
    if (renderPending) { renderPending = false; render(); }
  }
  document.addEventListener("dragend", () => setTimeout(endDrag, 0), true);
  function minuteAt(grid, e, len, grab) {
    const r = grid.getBoundingClientRect();
    const m = agendaRange.h0 * 60 + (e.clientY - r.top) / PX - (grab || 0);
    return clamp(Math.round(m / SNAP) * SNAP, agendaRange.h0 * 60, agendaRange.h1 * 60 - len);
  }

  function renderToday(open) {
    const wrap = el("div", "today");
    const left = el("div", "tcol");
    const boxed = open.filter(i => slots.has(i.id)).sort((a, b) => slots.get(a.id).start - slots.get(b.id).start);
    const unboxed = open.filter(i => !slots.has(i.id)).sort(byPrioThenDue);
    const canBox = !!db;
    const section = (name, items, extra, emptyText) => {
      const g = el("section", "group"); g.setAttribute("aria-label", name);
      const head = el("div", "ghead"); head.append(el("span", "t", name), el("span", "n", String(items.length)));
      if (extra) head.append(el("span", "n", extra));
      g.append(head);
      if (items.length) { const ul = el("ul", "list"); items.forEach(i => ul.append(row(i, { drag: canBox }))); g.append(ul); }
      else g.append(el("p", "hint", emptyText));
      left.append(g);
    };
    if (state.status === "ok" && !open.length) left.append(el("p", "empty", Object.keys(filters).length ? "No issues match these filters." : "Nothing is planned for today."));
    else if (open.length) {
      section("Not timeboxed", unboxed, "", "Every issue for today has a slot.");
      const total = boxed.reduce((n, i) => n + slots.get(i.id).end - slots.get(i.id).start, 0);
      section("Timeboxed", boxed, total ? `· ${fmtLen(total)}` : "", canBox ? "Drag an issue onto the agenda to give it a slot." : "Timeboxes can't be saved in this view.");
    }
    // Dropping a slot back on the list clears it.
    left.addEventListener("dragover", e => { if (drag && drag.from === "slot") { e.preventDefault(); e.dataTransfer.dropEffect = "move"; } });
    left.addEventListener("drop", e => { if (!drag || drag.from !== "slot") return; e.preventDefault(); const id = drag.id; saveSlot(id, null, `${id} timebox cleared`); });
    wrap.append(left, renderAgenda(open));
    return wrap;
  }

  function renderAgenda(open) {
    const box = el("section", "agenda"); box.setAttribute("aria-label", "Today's agenda");
    const head = el("div", "ag-head");
    const now = new Date();
    head.append(el("span", "t", `Agenda · ${WD[now.getDay()]} ${now.getDate()} ${MON[now.getMonth()]}`));
    if (cal.at && cal.status === "ok") { const t = new Date(cal.at); head.append(el("span", "s", `Outlook · ${pad(t.getHours())}:${pad(t.getMinutes())}`)); }
    box.append(head);
    const note = (text, btn) => { const p = el("p", "ag-note"); p.append(el("span", null, text)); if (btn) p.append(btn); box.append(p); };
    if (!mcp) note("Outlook isn't reachable in this view.");
    else if (cal.status === "loading") note("Loading your Outlook calendar…");
    else if (cal.error) {
      const c = errorCopy(cal.error, "Outlook");
      let b = null;
      if (c.action === "approve") { b = el("button", null, "Allow Outlook"); b.type = "button"; b.addEventListener("click", () => { b.disabled = true; approveCal(); }); }
      note(c.text, b);
    }
    if (!db && dbState === "off") note("Timeboxes can't be saved in this view, so dragging is off.");
    else if (dbState === "error") note(`Couldn't reach the board's storage. ${dbErrorText(dbErr)}`);
    else if (dbState === "slow") note("Timeboxes are still loading…");

    const allDay = cal.events.filter(e => e.allDay);
    if (allDay.length) { const strip = el("div", "allday"); allDay.forEach(e => strip.append(eventBlock(e, true))); box.append(strip); }

    const todayIds = new Set(open.map(i => i.id));
    const items = [
      ...cal.events.filter(e => !e.allDay).map(e => Object.assign({ kind: "event" }, e)),
      ...[...slots].map(([id, s]) => ({ kind: "slot", id, start: s.start, end: s.end, title: titleFor(id), orphan: !todayIds.has(id) })),
    ];
    let h0 = 8, h1 = 19;
    items.forEach(it => { h0 = Math.min(h0, Math.floor(it.start / 60)); h1 = Math.max(h1, Math.ceil(it.end / 60)); });
    h0 = clamp(h0, 0, 23); h1 = clamp(h1, h0 + 1, 24);
    agendaRange = { h0, h1 };
    const top = m => (m - h0 * 60) * PX;

    const grid = el("div", "agrid"); grid.style.height = `${(h1 - h0) * 60 * PX}px`;
    for (let h = h0; h <= h1; h++) { const l = el("div", "hr"); l.style.top = `${top(h * 60)}px`; if (h < 24) l.append(el("span", null, `${pad(h)}:00`)); grid.append(l); }
    layoutLanes(items).forEach(it => {
      const b = it.kind === "event" ? eventBlock(it) : slotBlock(it, grid);
      const len = Math.max(it.end - it.start, SNAP);
      b.style.top = `${top(it.start) + 1}px`; b.style.height = `${len * PX - 2}px`;
      b.style.left = `calc(${(it.col / it.cols) * 100}% + 2px)`; b.style.width = `calc(${100 / it.cols}% - 4px)`;

      ghostEl.textContent = `${fmtMin(m)}–${fmtMin(m + drag.len)}`;
    });
    grid.addEventListener("dragleave", e => { if (!grid.contains(e.relatedTarget)) ghostEl.hidden = true; });

      if (!drag) return;
      e.preventDefault(); e.stopPropagation();
      placeSlot(drag.id, minuteAt(grid, e, drag.len, drag.grab), drag.len);
    });
    const scroller = el("div", "agscroll");
    scroller.append(grid);
    box.append(scroller);
    return box;
  }
  function updateNow() {
    if (!nowEl || !nowEl.isConnected) return;
    const m = minutesNow();
    nowEl.style.top = `${(m - agendaRange.h0 * 60) * PX}px`; nowEl.hidden = m < agendaRange.h0 * 60 || m > agendaRange.h1 * 60;
  }
  function eventBlock(e, inline) {
    const b = el(e.url ? "a" : "div", "blk ev" + (e.free ? " free" : "") + (e.focus ? " focus" : ""));
    if (e.url) { b.href = e.url; b.target = "_blank"; b.rel = "noopener"; }
    const when = e.allDay ? "All day" : `${fmtMin(e.start)}–${fmtMin(e.end)}`;
    b.title = `${e.subject}\n${when}${e.location ? " · " + e.location : ""}${e.focus ? "\nFocus block (Outlook category To Do)" : ""}${e.free ? "\nShown as free" : ""}`;
    b.append(el("span", "bt", e.subject), el("span", "bm", when));
    if (inline) b.style.padding = "2px 8px";
    return b;
  }
  function slotBlock(it, grid) {
    const id = it.id, s = slots.get(id);
    const b = el("div", "blk slot" + (it.orphan ? " orphan" : ""));
    b.dataset.id = id; b.tabIndex = 0; b.draggable = !!db;
    b.setAttribute("role", "button");
    b.setAttribute("aria-label", `${id} ${it.title}, ${fmtMin(it.start)} to ${fmtMin(it.end)}. Enter opens it; arrow keys move it, Shift with arrows changes the length, Delete clears it.`);
    b.title = `${id} · ${it.title}\n${fmtMin(it.start)}–${fmtMin(it.end)}${it.orphan ? "\nNot in Today any more" : ""}`;
    const t = el("span", "bt"); t.append(el("span", "id", id), document.createTextNode(it.title || ""));
    const m = el("span", "bm", `${fmtMin(it.start)}–${fmtMin(it.end)}${it.orphan ? " · not in Today" : ""}`);
    b.append(t, m);
    const x = el("button", "x", "×"); x.type = "button"; x.title = "Clear timebox"; x.setAttribute("aria-label", `Clear timebox: ${id}`);
    x.addEventListener("click", e => { e.stopPropagation(); saveSlot(id, null, `${id} timebox cleared`); });
    x.addEventListener("pointerdown", e => e.stopPropagation());
    b.append(x);
    b.addEventListener("click", () => { if (Date.now() - justResized > 300) openPanel(id); });
    b.addEventListener("dragstart", e => { const r = b.getBoundingClientRect(); startDrag(e, id, "slot", b, (e.clientY - r.top) / PX); });
    b.addEventListener("dragend", endDrag);
    b.addEventListener("keydown", e => {
      if (e.target !== b || !s) return;
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openPanel(id); return; }
      if (e.key === "Delete" || e.key === "Backspace") { e.preventDefault(); saveSlot(id, null, `${id} timebox cleared`); return; }
      if (e.key !== "ArrowUp" && e.key !== "ArrowDown") return;
      e.preventDefault();
      const d = e.key === "ArrowUp" ? -SNAP : SNAP;
      focusSlot = id;
      if (e.shiftKey) { const end = clamp(s.end + d, s.start + SNAP, 1440); if (end !== s.end) saveSlot(id, Object.assign({}, s, { end }), `${id} now ${fmtMin(s.start)}–${fmtMin(end)}`); }
      else if (s.start + d >= 0 && s.end + d <= 1440) saveSlot(id, Object.assign({}, s, { start: s.start + d, end: s.end + d }), `${id} moved to ${fmtMin(s.start + d)}–${fmtMin(s.end + d)}`);
    });
    // Resize from the bottom edge, in 15-minute steps.
    if (db) {
      const grip = el("div", "grip"); grip.setAttribute("aria-hidden", "true");
      grip.addEventListener("pointerdown", e => {
        if (!s) return;
        e.preventDefault(); e.stopPropagation();
        resizing = { y0: e.clientY, end: s.end }; dragging = true;
        try { grip.setPointerCapture(e.pointerId); } catch (err) {}
      });
      grip.addEventListener("pointermove", e => {
        if (!resizing) return;
        const end = clamp(Math.round((s.end + (e.clientY - resizing.y0) / PX) / SNAP) * SNAP, s.start + SNAP, agendaRange.h1 * 60);
        if (end === resizing.end) return;
        resizing.end = end;
        b.style.height = `${(end - s.start) * PX - 2}px`; m.textContent = `${fmtMin(s.start)}–${fmtMin(end)}`;
      });
      const finish = () => {
        if (!resizing) return;
        const end = resizing.end; resizing = null; dragging = false; justResized = Date.now();
        if (end !== s.end) saveSlot(id, Object.assign({}, s, { end }), `${id} now ${fmtMin(s.start)}–${fmtMin(end)}`);
        else if (renderPending) { renderPending = false; render(); }
      };
      grip.addEventListener("pointerup", finish);
      grip.addEventListener("pointercancel", finish);
      grip.addEventListener("click", e => e.stopPropagation());
      b.append(grip);
    }
    return b;
  }

  // ---------- data ----------
  const listInput = { team: TEAM, limit: 250, fields: FIELDS };
  function onList(ev) {
    if (ev.type === "data") {
      const p = ev.result && ev.result.payload;
      state.issues = p && Array.isArray(p.issues) ? p.issues : [];
      state.more = !!(p && p.hasNextPage);
      state.status = "ok"; state.error = null;
      state.at = (ev.result.cache && ev.result.cache.storedAt) || Date.now();
    } else {
      state.error = ev.error || { code: "upstream_error" };
      if (AUTHZ.has(state.error.code)) { state.issues = []; state.status = "error"; state.at = null; }
      else if (state.status !== "ok") state.status = "error";
    }
    render();
  }
  async function loadOnce() {
    if (!mcp) return;
    try { onList({ type: "data", result: await mcp.callTool(LINEAR, "list_issues", listInput) }); }
    catch (err) { onList({ type: "error", error: err }); }
  }
  document.getElementById("refresh").addEventListener("click", async () => {
    if (!mcp) return;
    document.getElementById("fresh").textContent = "Refreshing…";
    try { await mcp.invalidate(LINEAR); } catch (e) {}
    setTimeout(render, 4000);
  });

  render();
  (async () => {
    const m = await (window.claude && window.claude.use ? window.claude.use("mcp") : Promise.resolve(null));
    if (!m) { state.status = "error"; state.error = { code: "not_granted" }; document.getElementById("fresh").textContent = "Not connected"; render(); return; }
    mcp = m;
    mcp.watchTool(LINEAR, "list_issues", listInput, onList, { cache: { staleTime: 60000, gcTime: 86400000 }, refetchInterval: 300000 });
    ensureToday();
  })();
  (async () => {
    const d = await (window.claude && window.claude.use ? window.claude.use("db") : Promise.resolve(null));
    db = d; dbState = d ? "loading" : "off";
    ensureToday();
    render();
  })();
  setInterval(render, 10 * 60 * 1000); // Today and Week follow the clock past midnight
  setInterval(() => { ensureToday(); updateNow(); }, 60 * 1000); // the agenda's now-line, and a new day's slots and events
})();
</script>
